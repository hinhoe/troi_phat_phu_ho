<script>
  const QUIZ = {"name":"125 chuong 1 (đã có đáp án)","questions":[{"id":"q_1_0","number":1,"text":"Một số công nhân có thu nhập tương đối cao nhưng không có khả năng tham gia quyết định về tổ chức sản xuất, phân phối lợi nhuận và chiến lược doanh nghiệp. Khi phân tích hiện tượng “trung lưu hóa” GCCN, kết luận nào phù hợp nhất?","options":{"A":"Sự tồn tại của tiền lương và phúc lợi chứng minh công nhân vẫn có vị trí giai cấp không thay đổi, bất kể sự thay đổi về tài sản và quyền kiểm soát.","B":"Việc không có quyền quyết định chứng minh đời sống vật chất của công nhân không thể được cải thiện trong nền kinh tế thị trường.","C":"Cần phân biệt cải thiện thu nhập, tiêu dùng với thay đổi vị trí trong quan hệ sở hữu và kiểm soát tư liệu sản xuất trước khi kết luận về biến đổi giai cấp.","D":"Thu nhập cao cho thấy công nhân đã chuyển sang giai cấp trung lưu, nên cần phân loại theo mức sống thay vì quan hệ sản xuất."},"correctAnswer":"C"},{"id":"q_2_1","number":2,"text":"Trong các điều kiện chủ quan để GCCN thực hiện sứ mệnh lịch sử, yếu tố nào có ý nghĩa đặc biệt quan trọng?","options":{"A":"GCCN tập trung chủ yếu vào việc nâng cao năng suất lao động và hạn chế tham gia các hoạt động chính trị - xã hội để tăng hiệu quả sản xuất.","B":"GCCN có mức thu nhập tương đương với các tầng lớp trung lưu và có khả năng tham gia ngày càng nhiều vào hoạt động đầu tư tài chính.","C":"GCCN có tổ chức chính trị tiên phong lãnh đạo, có ý thức giai cấp, có năng lực tổ chức và liên minh với các lực lượng lao động khác.","D":"GCCN có số lượng tuyệt đối lớn hơn tất cả các giai cấp, tầng lớp khác và chiếm tỷ lệ chủ yếu trong dân số của quốc gia."},"correctAnswer":"C"},{"id":"q_3_2","number":3,"text":"Để nâng cao bản lĩnh chính trị và tính giác ngộ giai cấp cho công nhân trong các doanh nghiệp ngoài khu vực nhà nước, giải pháp tổ chức cán bộ quan trọng nhất của Đảng là gì?","options":{"A":"Tăng cường xây dựng, phát triển tổ chức Đảng và các đoàn thể chính trị - xã hội trong các doanh nghiệp ngoài nhà nước.","B":"Phân công cán bộ công chức nhà nước về làm quản lý trực tiếp tại các công ty tư nhân.","C":"Quốc hữu hóa toàn bộ các doanh nghiệp tư nhân hoạt động không hiệu quả.","D":"Bắt buộc tất cả chủ doanh nghiệp tư nhân phải gia nhập Đảng Cộng sản Việt Nam."},"correctAnswer":"A"},{"id":"q_4_3","number":4,"text":"Một công nhân có thu nhập cao, mua được nhà ở và có khoản tiết kiệm đáng kể nhưng vẫn làm việc theo hợp đồng, không sở hữu hay kiểm soát doanh nghiệp. Khi đánh giá quan điểm cho rằng người này đã không còn thuộc GCCN, nhận định nào chặt chẽ nhất?","options":{"A":"Cần xem xét vị trí trong quan hệ sản xuất, quyền sở hữu và kiểm soát tư liệu sản xuất, thay vì chỉ dựa vào thu nhập và tài sản cá nhân.","B":"Khả năng tích lũy tài sản chứng minh người lao động đã trở thành chủ sở hữu tư bản, dù nguồn thu nhập chủ yếu vẫn đến từ tiền lương.","C":"Mức thu nhập và tài sản tích lũy là căn cứ chủ yếu để xác định giai cấp, vì khả năng tiêu dùng phản ánh trực tiếp quan hệ sản xuất.","D":"Việc làm theo hợp đồng là căn cứ duy nhất để xác định GCCN, bất kể người lao động có quyền sở hữu và kiểm soát doanh nghiệp hay không."},"correctAnswer":"A"},{"id":"q_5_4","number":5,"text":"Trong quá trình xây dựng CNXH, việc tăng cường mối liên hệ giữa Đảng và GCCN có ý nghĩa chủ yếu nào?","options":{"A":"Giúp Đảng nắm bắt thực tiễn, lợi ích và tâm tư của người lao động, đồng thời củng cố cơ sở xã hội và năng lực lãnh đạo của Đảng.","B":"Bảo đảm mọi lợi ích của GCCN được ưu tiên tuyệt đối so với lợi ích của nông dân, trí thức và các tầng lớp xã hội khác trong quá trình phát triển.","C":"Tạo điều kiện để GCCN trực tiếp thay thế các cơ quan nhà nước trong việc hoạch định và tổ chức thực hiện chính sách phát triển kinh tế - xã hội.","D":"Bảo đảm Đảng có thêm nguồn nhân lực để thực hiện các nhiệm vụ quản lý hành chính và tổ chức sản xuất trong các doanh nghiệp."},"correctAnswer":"A"},{"id":"q_6_5","number":6,"text":"Luận điểm nào sau đây thể hiện đúng nhất bản chất kinh tế - xã hội của giai cấp công nhân theo quan điểm của chủ nghĩa Mác - Lênin?","options":{"A":"Là những người trực tiếp hoặc gián tiếp vận hành công cụ sản xuất mang tính chất công nghiệp.","B":"Là những người chiếm đa số, nghèo khổ nhất trong xã hội tư bản.","C":"Là những người không có tư liệu sản xuất làm thuê cho quan lại địa chủ, phong kiến và bị bóc lột giá trị thặng dư.","D":"Là tập đoàn lao động không có tư liệu sản xuất, phải bán sức lao động cho nhà tư bản và bị bóc lột giá trị thặng dư."},"correctAnswer":"D"},{"id":"q_7_6","number":7,"text":"Trong bối cảnh Việt Nam tham gia sâu vào các Hiệp định thương mại tự do thế hệ mới (CPTPP, EVFTA), để bảo đảm quyền lợi chính trị - xã hội của giai cấp công nhân mà không làm phá vỡ ổn định kinh tế, Đảng ta đề ra định hướng giải pháp nào?","options":{"A":"Từ chối nội luật hóa các tiêu chuẩn lao động quốc tế cơ bản của ILO để bảo hộ thị trường lao động trong nước.","B":"Cho phép thành lập các công đoàn độc lập hoạt động nằm ngoài sự quản lý của Hiến pháp và pháp luật Việt Nam.","C":"Chủ động hoàn thiện hệ thống pháp luật lao động tương thích với các cam kết quốc tế, đồng thời tăng cường quản lý nhà nước.","D":"Bãi bỏ hoàn toàn các quy định về mức lương tối thiểu vùng để các doanh nghiệp tự do thỏa thuận tiền lương."},"correctAnswer":"C"},{"id":"q_8_7","number":8,"text":"Đặc điểm \"phần lớn công nhân Việt Nam xuất thân từ nông dân\" tạo ra thực trạng chính trị - xã hội hai mặt nào trong đời sống công nhân tại các khu công nghiệp hiện nay?","options":{"A":"Lợi thế về khả năng thích ứng công nghệ; hạn chế về tính đoàn kết cộng đồng tại nơi cư trú tạm trú.","B":"Lợi thế về trình độ học vấn cao; hạn chế về tinh thần chịu gian khổ trong môi trường sản xuất công nghiệp.","C":"Lợi thế về tư duy kinh doanh thương mại; hạn chế về bản lĩnh chính trị và tính giác ngộ giai cấp.","D":"Lợi thế về mối liên minh tự nhiên công - nông; hạn chế về tác phong công nghiệp và kỷ luật lao động."},"correctAnswer":"D"},{"id":"q_9_8","number":9,"text":"Xét về phương thức lao động, phương thức sản xuất, giai cấp công nhân mang thuộc tính cơ bản nào?","options":{"A":"Là giai cấp tạo ra của cải vật chất làm giàu cho xã hội.","B":"Là giai cấp trực tiếp hay gián tiếp vận hành các công cụ sản xuất có tính chất công nghiệp ngày càng hiện đại, tính xã hội hóa cao.","C":"Có số lượng đông nhất trong dân cư.","D":"Cả ba câu đều đúng."},"correctAnswer":"B"},{"id":"q_10_9","number":10,"text":"Một công nhân cho rằng: \"Đã là thành viên của giai cấp công nhân thì đương nhiên có đầy đủ nhận thức chính trị và khả năng lãnh đạo cách mạng\". Theo lý luận Mác - Lênin, nhận định này:","options":{"A":"Chưa đúng vì địa vị giai cấp là cơ sở khách quan nhưng ý thức chính trị tự giác và năng lực tổ chức cần được hình thành thông qua giáo dục, đấu tranh và tổ chức.","B":"Đúng vì địa vị kinh tế - xã hội của GCCN tự động tạo ra đầy đủ ý thức chính trị và năng lực tổ chức cách mạng cho mỗi cá nhân công nhân.","C":"Đúng vì mọi công nhân đều có cùng trình độ nhận thức, lợi ích và khả năng tham gia hoạt động chính trị trong mọi điều kiện lịch sử.","D":"Chưa đúng vì chỉ những công nhân có trình độ đại học mới có khả năng hình thành ý thức chính trị và tham gia vào hoạt động lãnh đạo xã hội."},"correctAnswer":"A"},{"id":"q_11_10","number":11,"text":"Trong phương thức sản xuất tư bản chủ nghĩa, vị trí của giai cấp công nhân đối với lực lượng sản xuất được đặc trưng bởi yếu tố nào?","options":{"A":"Là giai cấp nắm giữ toàn bộ tư liệu sản xuất chủ yếu của xã hội.","B":"Là giai cấp không tham gia vào quá trình tạo ra sản xuất vật chất.","C":"Là lực lượng sản xuất đại biểu cho phương thức sản xuất tiên tiến, hiện đại.","D":"Là lực lượng duy nhất quyết định mọi chính sách kinh tế của nhà nước tư bản."},"correctAnswer":"C"},{"id":"q_12_11","number":12,"text":"Một địa phương muốn củng cố mối liên hệ giữa GCCN với nông dân và đội ngũ trí thức trong quá trình hiện đại hóa. Phương hướng nào phù hợp nhất?","options":{"A":"Tổ chức hoạt động giao lưu định kỳ giữa các nhóm, đồng thời duy trì hợp tác chủ yếu trên cơ sở vận động tinh thần đoàn kết.","B":"Phân công từng nhóm đảm nhận một lĩnh vực riêng biệt, đồng thời hạn chế giao thoa lợi ích để giảm phát sinh bất đồng trong quá trình hợp tác.","C":"Ưu tiên phát triển công nghiệp làm động lực chính, đồng thời để nông nghiệp và nghiên cứu khoa học tự điều chỉnh theo nhu cầu doanh nghiệp.","D":"Gắn đào tạo, nghiên cứu, chuyển giao công nghệ và tổ chức sản xuất với lợi ích các bên, đồng thời xây dựng cơ chế phối hợp và giải quyết bất đồng."},"correctAnswer":"D"},{"id":"q_13_12","number":13,"text":"Điểm đặc thù về lịch sử hình thành của giai cấp công nhân Việt Nam so với giai cấp công nhân ở các nước tư bản phương Tây là gì?","options":{"A":"Ra đời trong thời kỳ công nghiệp hóa, hiện đại hóa sau năm 1986.","B":"Ra đời trước giai cấp tư sản dân tộc, gắn liền với cuộc khai thác thuộc địa của thực dân Pháp.","C":"Ra đời sau khi giai cấp tư sản Việt Nam đã nắm giữ chính quyền.","D":"Ra đời từ sự phát triển tự nhiên của nền kinh tế tư bản chủ nghĩa nội địa."},"correctAnswer":"B"},{"id":"q_14_13","number":14,"text":"Nội dung sứ mệnh lịch sử của giai cấp công nhân là gì?","options":{"A":"Cả ba câu đều đúng.","B":"Xây dựng chủ nghĩa xã hội và chủ nghĩa cộng sản.","C":"Xoá bỏ chế độ tư bản chủ nghĩa, xoá bỏ chế độ người bóc lột người.","D":"Giải phóng giai cấp công nhân, nhân dân lao động và toàn thể nhân loại khỏi mọi sự áp bức, bóc lột, nghèo nàn lạc hậu."},"correctAnswer":"A"},{"id":"q_15_14","number":15,"text":"Phân tích thực trạng một lao động là kỹ sư lập trình phần mềm tại một doanh nghiệp công nghệ thông tin tư nhân ở Hà Nội: người này không sở hữu tư liệu sản xuất chủ yếu, làm việc nhận lương theo hợp đồng và đóng góp trực tiếp vào chuỗi giá trị của doanh nghiệp. Vận dụng khái niệm GCCN Việt Nam, nhận định nào sau đây là đúng nhất?","options":{"A":"Người này thuộc giai cấp tư sản vì có thu nhập tài chính cá nhân cao hơn mức trung bình của xã hội.","B":"Người này thuộc giai cấp công nhân Việt Nam vì chịu sự quản lý và bán sức lao động trong nền kinh tế thị trường.","C":"Người này thuộc tầng lớp trí thức thuần túy và hoàn toàn nằm ngoài cơ cấu giai cấp công nhân Việt Nam.","D":"Người này thuộc tầng lớp tiểu tư sản do có điều kiện làm việc độc lập và sở hữu thiết bị lao động cá nhân."},"correctAnswer":"B"},{"id":"q_16_15","number":16,"text":"Sự gắn kết giữa công nhân công nghiệp với đội ngũ trí thức trong các dự án chuyển đổi số quốc gia ở Việt Nam thể hiện nội dung thực tiễn nào?","options":{"A":"Sự hình thành một giai cấp mới thay thế vai trò lãnh đạo của Đảng Cộng sản.","B":"Yêu cầu khách quan về sự liên minh, hợp tác giữa lực lượng sản xuất trực tiếp và tri thức khoa học.","C":"Sự hoàn thành xong quá trình xây dựng nền kinh tế tri thức ở nước ta.","D":"Việc công nhân bị phụ thuộc hoàn toàn vào mệnh lệnh kỹ thuật của tầng lớp trí thức."},"correctAnswer":"B"},{"id":"q_17_16","number":17,"text":"Việc một bộ phận lao động công nhân Việt Nam ra nước ngoài làm việc theo hợp đồng (xuất khẩu lao động) phản ánh khía cạnh thực tiễn nào của SMLS GCCN trong thời đại ngày nay?","options":{"A":"Sự thừa thãi và không thể sử dụng nguồn lao động trong nước của nền kinh tế.","B":"Mất đi tính gắn bó với sự nghiệp xây dựng chủ nghĩa xã hội tại quê hương.","C":"Việc từ bỏ địa vị giai cấp để trở thành lực lượng lao động tự do toàn cầu.","D":"Hội nhập quốc tế, rèn luyện tác phong công nghiệp và thể hiện bản chất quốc tế của GCCN."},"correctAnswer":"D"},{"id":"q_18_17","number":18,"text":"Theo lý luận Chủ nghĩa xã hội khoa học, nội dung sứ mệnh lịch sử của giai cấp công nhân ở các nước tư bản chủ nghĩa hiện nay trên lĩnh vực kinh tế - xã hội thể hiện qua hành động nào?","options":{"A":"Đấu tranh chống lại sự bất công xã hội, bảo vệ quyền lợi người lao động và xây dựng các giá trị văn hóa tiến bộ, nhân văn.","B":"Giữ vai trò nòng cốt trong sự nghiệp công nghiệp hóa, hiện đại hóa và phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa.","C":"Chống lại sự áp bức, bất công xã hội, thu hẹp khoảng cách giàu nghèo và bảo vệ quyền lợi của người lao động.","D":"Đấu tranh chống lại sự bóc lột giá trị thặng dư tinh vi của tư bản và đòi hỏi sự phân phối công bằng hơn về kết quả sản xuất."},"correctAnswer":"D"},{"id":"q_19_18","number":19,"text":"Nếu trong quá trình công nghiệp hóa, lợi ích của công nhân, nông dân và trí thức có những điểm khác nhau, điều đó có phủ nhận cơ sở của liên minh giữa các lực lượng này không?","options":{"A":"Không, vì liên minh dựa trên những lợi ích cơ bản và mục tiêu chung, đồng thời cần có cơ chế giải quyết hài hòa những khác biệt lợi ích cụ thể.","B":"Có, vì liên minh chỉ có thể tồn tại khi mọi lợi ích kinh tế của các giai cấp và tầng lớp hoàn toàn giống nhau trong mọi điều kiện.","C":"Không, vì trong thời kỳ quá độ mọi khác biệt giai cấp và tầng lớp đã được xóa bỏ về cơ bản nên không còn vấn đề lợi ích cần giải quyết.","D":"Có, vì bất kỳ sự khác biệt lợi ích nào giữa các lực lượng xã hội đều tất yếu dẫn đến xung đột đối kháng không thể điều chỉnh bằng chính sách."},"correctAnswer":"A"},{"id":"q_20_19","number":20,"text":"C. Mác và Ph. Ăngghen đã dựa vào những phát kiến nào để xây dựng luận chứng về sứ mệnh lịch sử của giai cấp công nhân?","options":{"A":"Triết học cổ điển Đức và Kinh tế chính trị học cổ điển Anh.","B":"Chủ nghĩa duy vật lịch sử và học thuyết giá trị thặng dư","C":"Cả ba câu đều đúng.","D":"Chủ nghĩa xã hội không tưởng."},"correctAnswer":"B"},{"id":"q_21_20","number":21,"text":"Sự xuất hiện các hành vi vi phạm pháp luật lao động (trốn đóng BHXH, nợ lương) của một số chủ doanh nghiệp đối với công nhân phản ánh thực trạng chính trị - xã hội nào ở Việt Nam hiện nay?","options":{"A":"Sự mất hiệu lực của các văn bản quy phạm pháp luật do Nhà nước ban hành.","B":"Sự suy yếu về bản lĩnh chính trị của giai cấp công nhân trước giai cấp tư sản.","C":"Việc thực thi pháp luật và cơ chế bảo vệ quyền lợi GCCN ở một số nơi chưa triệt để, hiệu quả.","D":"Sự tha hóa hoàn toàn của nền kinh tế thị trường định hướng xã hội chủ nghĩa."},"correctAnswer":"C"},{"id":"q_22_21","number":22,"text":"Nhằm giải quyết triệt để bất cập về trình độ \"kỹ năng mềm\" và \"tác phong công nghiệp\" của một bộ phận lớn công nhân xuất thân từ nông thôn, đường lối phát triển nguồn nhân lực của Đảng nhấn mạnh giải pháp đột phá nào?","options":{"A":"Bắt buộc tất cả công nhân mới tuyển dụng phải trải qua thời gian nghĩa vụ quân sự trước khi vào nhà máy.","B":"Tăng thời gian thử việc tối đa tại các doanh nghiệp lên 12 tháng để rèn luyện ý thức tổ chức cho người lao động.","C":"Áp dụng các chế tài xử phạt hành chính thật nặng đối với các hành vi vi phạm kỷ luật của người lao động tại xưởng.","D":"Đổi mới giáo dục nghề nghiệp gắn với đào tạo kỷ luật lao động, văn hóa doanh nghiệp và kỹ năng sống hiện đại."},"correctAnswer":"D"},{"id":"q_23_22","number":23,"text":"Nhằm phát huy vai trò tiên phong của giai cấp công nhân trong sự nghiệp công nghiệp hóa, hiện đại hóa và hội nhập quốc tế, đường lối của Đảng nhấn mạnh việc kết hợp chặt chẽ giữa \"phát triển giai cấp công nhân\" với quá trình nào?","options":{"A":"Quá trình phát triển kinh tế tri thức, chuyển đổi số, xanh hóa nền kinh tế và củng cố khối đại đoàn kết toàn dân tộc.","B":"Quá trình thương mại hóa hoàn toàn các dịch vụ an sinh xã hội tại các khu công nghiệp và đô thị lớn.","C":"Quá trình ưu tiên phát triển kinh tế hộ gia đình nông thôn và thu hẹp quy mô sản xuất công nghiệp tập trung.","D":"Quá trình khôi phục mô hình quản lý tập trung bao cấp và xóa bỏ các thành phần kinh tế phi xã hội chủ nghĩa."},"correctAnswer":"A"},{"id":"q_24_23","number":24,"text":"Thực tiễn phát triển các mô hình \"Nông nghiệp công nghệ cao\" có sự kết hợp giữa doanh nghiệp, nhà khoa học và hộ nông dân tại Việt Nam hiện nay thể hiện nội dung lý luận nào?","options":{"A":"Sự tăng cường khối liên minh công nhân - nông dân - trí thức trên phương diện kinh tế - kỹ thuật.","B":"Việc hoàn thành quá trình xóa bỏ sự khác biệt giữa đô thị và nông thôn trong thời kỳ quá độ.","C":"Sự suy giảm vai trò lãnh đạo của giai cấp công nhân đối với tiến trình công nghiệp hóa nông thôn.","D":"Sự thay thế hoàn toàn giai cấp nông dân bằng lực lượng công nhân nông nghiệp trong thời kỳ mới."},"correctAnswer":"A"},{"id":"q_25_24","number":25,"text":"Theo chủ nghĩa Mác - Lênin, tại sao Đảng Cộng sản được xem là nhân tố quan trọng hàng đầu bảo đảm GCCN thực hiện sứ mệnh lịch sử?","options":{"A":"Vì Đảng Cộng sản có quyền quyết định mọi hoạt động của GCCN nên công nhân không cần phát huy tính chủ động và sáng tạo của mình.","B":"Vì Đảng Cộng sản thay thế hoàn toàn GCCN trong mọi hoạt động kinh tế, chính trị và xã hội của quá trình xây dựng chủ nghĩa xã hội.","C":"Vì chỉ Đảng Cộng sản mới có khả năng tham gia hoạt động sản xuất và trực tiếp đại diện cho người lao động trong các doanh nghiệp.","D":"Vì Đảng Cộng sản cung cấp đường lối chính trị, tổ chức và lãnh đạo GCCN chuyển từ đấu tranh tự phát sang đấu tranh tự giác nhằm thực hiện mục tiêu cách mạng."},"correctAnswer":"D"},{"id":"q_26_25","number":26,"text":"Thực tế hiện nay cho thấy một bộ phận công nhân trẻ tại các khu công nghiệp chưa tích cực tham gia sinh hoạt đoàn thể và thiếu sự tha thiết gia nhập Đảng. Phân tích dưới góc độ lý luận, đâu là nguyên nhân thực trạng chính trị - xã hội này?","options":{"A":"Do áp lực tăng ca kiếm sống, sự dịch chuyển lao động tự do và công tác vận động, phát triển Đảng chưa linh hoạt.","B":"Do giai cấp công nhân Việt Nam đã hoàn thành xong sứ mệnh lịch sử nên không cần tổ chức chính trị lãnh đạo.","C":"Do sự biến mất hoàn toàn của bản chất cách mạng trong giai cấp công nhân trước tác động của kinh tế thị trường.","D":"Do công nhân hiện nay đã trở thành chủ sở hữu tư liệu sản xuất nên không còn nhu cầu đấu tranh chính trị."},"correctAnswer":"A"},{"id":"q_27_26","number":27,"text":"Văn kiện Đại hội XIII của Đảng Cộng sản Việt Nam đã đặt ra yêu cầu cốt lõi hoàn toàn mới nào về phương hướng xây dựng giai cấp công nhân Việt Nam trong thời kỳ đẩy mạnh chuyển đổi số và hội nhập quốc tế?","options":{"A":"Xây dựng giai cấp công nhân Việt Nam hiện đại, lớn mạnh; gắn liền với gắn kết giáo dục nghề nghiệp với thị trường lao động.","B":"Cắt giảm tỷ lệ lao động làm việc trong các ngành dịch vụ để tập trung nguồn lực phát triển công nghiệp nặng.","C":"Giới hạn tối đa việc thu hút nguồn vốn đầu tư trực tiếp nước ngoài (FDI) để tránh nguy cơ bóc lột lao động.","D":"Chuyển giao toàn bộ quyền quản lý các tập đoàn kinh tế nhà nước cho đội ngũ công nhân trực tiếp sản xuất."},"correctAnswer":"A"},{"id":"q_28_27","number":28,"text":"Phương hướng giải pháp nào giúp giai cấp công nhân Việt Nam phát huy vai trò nòng cốt trong việc bảo vệ môi trường và phát triển bền vững?","options":{"A":"Yêu cầu công nhân từ chối vận hành các thiết bị máy móc cũ khi chưa được thay mới.","B":"Tuyên truyền, nâng cao nhận thức, thúc đẩy công nhân tham gia sáng kiến \"sản xuất xanh\", tiết kiệm năng lượng và kinh tế tuần hoàn.","C":"Ủy quyền hoàn toàn nhiệm vụ kiểm soát ô nhiễm cho các nhà khoa học và tổ chức quốc tế.","D":"Phát động phong trào công nhân thi đấu tranh đòi đóng cửa toàn bộ các ngành công nghiệp hóa chất."},"correctAnswer":"B"},{"id":"q_29_28","number":29,"text":"Trong quá trình thực hiện chuyển đổi số quốc gia, để ngăn chặn nguy cơ \"giai cấp công nhân bị tụt hậu về trình độ công nghệ\", giải pháp chính sách phát triển nguồn nhân lực của Nhà nước chú trọng hướng nào?","options":{"A":"Tăng cường ngân sách cho đề án đào tạo lại, bồi dưỡng kỹ năng số và năng lực thích ứng công nghệ cho công nhân.","B":"Yêu cầu các doanh nghiệp chỉ được sử dụng trí tuệ nhân tạo ở các công đoạn nghiên cứu, không áp dụng sản xuất.","C":"Bắt buộc người lao động phải tự bỏ kinh phí cá nhân đi học các chứng chỉ quốc tế trước khi ký hợp đồng làm việc.","D":"Áp dụng thuế tiêu thụ đặc biệt đối với các doanh nghiệp nhập khẩu hệ thống dây chuyền tự động hóa cao."},"correctAnswer":"A"},{"id":"q_30_29","number":30,"text":"Để GCCN Việt Nam thực hiện tốt sứ mệnh lịch sử trong điều kiện mới, giải pháp nào có tính toàn diện nhất?","options":{"A":"Tập trung chủ yếu vào việc tăng tiền lương vì lợi ích kinh tế là cơ sở duy nhất quyết định ý thức chính trị và vai trò xã hội của công nhân.","B":"Chỉ tập trung phát triển số lượng công nhân và mở rộng khu vực công nghiệp để nhanh chóng tăng quy mô lực lượng lao động.","C":"Chỉ chú trọng đào tạo công nhân kỹ thuật cao vì khi người lao động có trình độ chuyên môn cao thì các vấn đề về đời sống và ý thức sẽ tự động được giải quyết.","D":"Đồng thời nâng cao chất lượng GCCN, trình độ khoa học - công nghệ, ý thức chính trị, đời sống vật chất - tinh thần và năng lực tổ chức của người lao động."},"correctAnswer":"D"},{"id":"q_31_30","number":31,"text":"Để phát triển nguồn nhân lực chất lượng cao cho giai cấp công nhân, giải pháp về giáo dục - đào tạo mang tính đột phá ở Việt Nam hiện nay là gì?","options":{"A":"Gắn kết chặt chẽ giữa cơ sở đào tạo nghề với doanh nghiệp, đào tạo theo nhu cầu thị trường và chuẩn hóa kỹ năng.","B":"Bắt buộc tất cả học sinh sau khi tốt nghiệp THCS phải vào làm việc ngay tại các nhà máy.","C":"Tập trung mở rộng đào tạo đại học hàn lâm và giảm quy mô hệ thống học nghề.","D":"Ngừng cấp phép cho các cơ sở đào tạo nghề tư nhân để tập trung cho trường công lập."},"correctAnswer":"A"},{"id":"q_32_31","number":32,"text":"Mối quan hệ tự nhiên và gắn bó bền chặt giữa giai cấp công nhân Việt Nam với giai cấp nông dân xuất phát từ nguyên nhân nào?","options":{"A":"Do công nhân và nông dân có cùng mức thu nhập hằng tháng","B":"Do giai cấp công nhân Việt Nam phần lớn xuất thân từ nông dân và có chung kẻ thù áp bức.","C":"Do pháp luật quy định công nhân bắt buộc phải hỗ trợ nông dân.","D":"Do nông dân là lực lượng nắm vai trò lãnh đạo cách mạng Việt Nam."},"correctAnswer":"B"},{"id":"q_33_32","number":33,"text":"Nhằm tăng cường sự tham gia của công nhân vào hệ thống chính trị, giải pháp về công tác cán bộ của Đảng đối với các cơ quan dân cử (Quốc hội, HĐND) là gì?","options":{"A":"Bảo đảm tỷ lệ hợp lý đại diện cho công nhân trực tiếp và cán bộ công đoàn trong các cơ quan dân cử các cấp.","B":"Phân công đại biểu Quốc hội làm việc kiêm nhiệm tại các tổ công đoàn cơ sở.","C":"Bãi bỏ yêu cầu về trình độ học vấn đối với các ứng cử viên là công nhân lao động.","D":"Bắt buộc 100% đại biểu Quốc hội phải là công nhân trực tiếp sản xuất tại nhà máy."},"correctAnswer":"A"},{"id":"q_34_33","number":34,"text":"Một địa phương muốn tăng cường ý thức chính trị và hiểu biết pháp luật cho công nhân nhưng họ thường làm việc theo ca, ít thời gian tham gia sinh hoạt. Phương án nào phù hợp nhất?","options":{"A":"Tổ chức các lớp tập trung ngoài giờ làm việc, đồng thời đánh giá hiệu quả chủ yếu qua số buổi học và số công nhân có mặt.","B":"Tập trung giáo dục chính trị cho cán bộ quản lý và công đoàn, đồng thời để công nhân tiếp cận thông tin thông qua các kênh truyền thông chung.","C":"Đa dạng hóa hình thức tuyên truyền, gắn nội dung với quyền lợi và trách nhiệm thực tế, phối hợp doanh nghiệp và tổ chức đại diện để mở rộng khả năng tiếp cận.","D":"Chuyển toàn bộ nội dung giáo dục chính trị sang hình thức trực tuyến, đồng thời giao công nhân tự nghiên cứu để không ảnh hưởng sản xuất."},"correctAnswer":"C"},{"id":"q_35_34","number":35,"text":"Theo quan điểm của chủ nghĩa Mác - Lênin, căn cứ quan trọng để xác định giai cấp công nhân là:","options":{"A":"Địa vị của người lao động trong quan hệ sản xuất và sự gắn với nền sản xuất công nghiệp hiện đại.","B":"Mức thu nhập bình quân và khả năng tiêu dùng của người lao động.","C":"Tên nghề nghiệp và nơi làm việc của người lao động.","D":"Trình độ học vấn cao và khả năng sử dụng công nghệ của người lao động."},"correctAnswer":"A"},{"id":"q_37_35","number":37,"text":"Tại sao cuộc cách mạng do giai cấp công nhân lãnh đạo nhằm thực hiện sứ mệnh lịch sử của mình lại mang bản chất giải phóng toàn thể nhân loại khỏi mọi sự áp bức, bóc lột?","options":{"A":"Vì sau khi giành chính quyền, giai cấp công nhân sẽ lập tức bãi bỏ sự tồn tại của nhà nước để thiết lập một xã hội tự do tuyệt đối cho mọi người.","B":"Vì mục tiêu của giai cấp công nhân là biến tất cả các giai tầng khác trong xã hội thành công nhân để xóa bỏ sự khác biệt về địa vị kinh tế.","C":"Vì giai cấp công nhân là lực lượng lao động duy nhất bị áp bức và có lòng vị tha, luôn mong muốn chia sẻ tài sản cho các tầng lớp lao động khác.","D":"Vì giai cấp công nhân chỉ có thể tự giải phóng mình khi xóa bỏ triệt để chế độ tư hữu tư bản chủ nghĩa - nguồn gốc sinh ra mọi sự bóc lột giai cấp."},"correctAnswer":"D"},{"id":"q_38_36","number":38,"text":"Đặc điểm xuất thân từ nông dân của đại đa số công nhân Việt Nam hiện nay đem lại lợi thế thực tiễn nào nhưng đồng thời tạo ra hạn chế gì?","options":{"A":"Lợi thế về tư duy kinh doanh; hạn chế về bản lĩnh đấu tranh chính trị giai cấp.","B":"Lợi thế về trình độ học vấn cao; hạn chế về tinh thần chịu gian khổ trong sản xuất.","C":"Lợi thế về tình đoàn kết công - nông; hạn chế về tác phong công nghiệp và kỷ luật lao động.","D":"Lợi thế về tài chính; hạn chế về khả năng tiếp thu công nghệ thông tin hiện đại."},"correctAnswer":"C"},{"id":"q_39_37","number":39,"text":"Một số luận điệu xuyên tạc cho rằng \"Công đoàn Việt Nam chỉ là cánh tay nối dài của Đảng chứ không bảo vệ công nhân\". Thực tiễn hoạt động công đoàn tại Việt Nam bác bỏ quan điểm này vì lý do nào?","options":{"A":"Công đoàn chỉ tập trung vào các hoạt động từ thiện mà không tham gia vào quan hệ lao động.","B":"Công đoàn Việt Nam là tổ chức đại diện riêng cho giai cấp tư sản để quản lý công nhân.","C":"Công đoàn vừa giữ vững sự lãnh đạo của Đảng vừa chủ động tham gia thương lượng tập thể, bảo vệ quyền lợi hợp pháp của công nhân.","D":"Công đoàn Việt Nam hoạt động hoàn toàn độc lập và không tuân theo Cương lĩnh của Đảng."},"correctAnswer":"C"},{"id":"q_40_38","number":40,"text":"Việc GCCN ngày càng được “trí thức hóa” có ý nghĩa gì đối với quan niệm về GCCN hiện đại?","options":{"A":"Cho thấy ranh giới giữa lao động chân tay và lao động trí óc có nhiều thay đổi, nhưng không phủ nhận địa vị giai cấp của những người vẫn sống chủ yếu bằng việc bán sức lao động.","B":"Cho thấy chỉ những lao động trực tiếp vận hành máy móc mới có thể được xem là GCCN, còn những người làm công việc kỹ thuật cao phải được xếp vào tầng lớp trí thức.","C":"Chứng minh rằng GCCN đang biến mất vì khi trình độ học vấn tăng lên thì người lao động tất yếu chuyển sang tầng lớp trí thức.","D":"Chứng minh rằng trí thức đã thay thế GCCN vì khoa học và công nghệ hiện nay quyết định hoàn toàn sự phát triển của lực lượng sản xuất."},"correctAnswer":"A"},{"id":"q_41_39","number":41,"text":"Thực trạng đình công tự phát ở một số doanh nghiệp có vốn đầu tư nước ngoài (FDI) tại Việt Nam những năm qua chủ yếu xuất phát từ nguyên nhân trực tiếp nào?","options":{"A":"Yêu cầu đòi xóa bỏ chế độ tư hữu tư bản chủ nghĩa ngay lập tức của tập thể người lao động.","B":"Sự trỗi dậy của tư tưởng vô chính phủ và việc bác bỏ vai trò của các tổ chức công đoàn chính thức.","C":"Bất đồng về lợi ích kinh tế, điều kiện lao động và vi phạm quy định pháp luật lao động từ phía chủ sử dụng.","D":"Sự xúi giục của các thế lực thù địch nhằm lật đổ sự lãnh đạo của Đảng Cộng sản Việt Nam."},"correctAnswer":"C"},{"id":"q_42_40","number":42,"text":"Trong một chuỗi cung ứng toàn cầu, công nhân Việt Nam sản xuất hàng xuất khẩu theo tiêu chuẩn quốc tế nhưng ít có khả năng thương lượng về giá và điều kiện phân phối giá trị. Phân tích nào phù hợp nhất?","options":{"A":"Tiêu chuẩn sản xuất quốc tế đã bảo đảm quyền lợi cơ bản cho công nhân, nên khác biệt về tiền lương và phân phối giá trị không còn là vấn đề đáng kể.","B":"Khả năng thương lượng hạn chế chủ yếu bắt nguồn từ quy mô doanh nghiệp, không liên quan đến cơ cấu ngành nghề hay vị trí trong chuỗi giá trị.","C":"Tham gia chuỗi cung ứng quốc tế cho thấy công nhân đã được hưởng lợi tương xứng từ toàn bộ giá trị hàng hóa, vì sản phẩm đáp ứng tiêu chuẩn toàn cầu.","D":"Hội nhập giúp mở rộng việc làm nhưng không tự động bảo đảm vị trí thương lượng thuận lợi; cần xem xét vị trí trong chuỗi giá trị và quan hệ lao động."},"correctAnswer":"D"},{"id":"q_43_41","number":43,"text":"Nhằm ngăn chặn âm mưu lợi dụng tranh chấp lao động để kích động gây mất an ninh trật tự của các thế lực thù địch, giải pháp chính trị - xã hội hàng đầu được Đảng ta xác định là gì?","options":{"A":"Cấm tuyệt đối mọi hình thức đình công và bãi công trong tất cả các loại hình doanh nghiệp.","B":"Đuổi việc ngay lập tức những công nhân tham gia vào các cuộc đối thoại đòi tăng lương.","C":"Tăng cường lực lượng quân đội túc trực thường xuyên bên trong các khu chế xuất.","D":"Xây dựng quan hệ lao động hài hòa, ổn định, tiến bộ và chủ động giải quyết hòa giải các bất đồng từ cơ sở."},"correctAnswer":"D"},{"id":"q_44_42","number":44,"text":"Quy luật hình thành và phát triển của Đảng cộng sản Việt Nam là gì?","options":{"A":"Chủ nghĩa Mác - Lênin kết hợp phong trào công nhân và phong trào yêu nước.","B":"Chủ nghĩa Mác - Lênin kết hợp tư tưởng Hồ Chí Minh và phong trào công nhân.","C":"Chủ nghĩa Mác kết hợp tư tưởng Hồ Chí Minh và phong trào nông nhân.","D":"Chủ nghĩa Mác - Lênin kết hợp với tư tưởng Hồ Chí Minh và phong trào công nhân và phong trào yêu nước."},"correctAnswer":"A"},{"id":"q_45_43","number":45,"text":"Một số luận điệu cho rằng \"Việt Nam hiện nay phát triển kinh tế tư nhân là chủ yếu nên giai cấp công nhân không còn vai trò lãnh đạo\". Vận dụng lý luận SMLS của GCCN, nhận định này sai vì lý do nào?","options":{"A":"Phủ nhận hoàn toàn sự tồn tại của các thành phần kinh tế phi xã hội chủ nghĩa ở Việt Nam.","B":"Bỏ qua thực tiễn giai cấp công nhân Việt Nam lãnh đạo xã hội thông qua Đảng Cộng sản và nắm giữ các ngành kinh tế then chốt.","C":"Nhầm lẫn giữa giai cấp công nhân với tầng lớp doanh nhân trong việc tạo ra của cải vật chất.","D":"Đánh giá thấp khả năng tài chính cá nhân của người lao động trong các doanh nghiệp tư nhân."},"correctAnswer":"B"},{"id":"q_46_44","number":46,"text":"Đặc trưng cơ bản nhất của giai cấp công nhân là gì?","options":{"A":"Không có tư liệu sản xuất, phải bán sức lao động.","B":"Bị giai cấp tư sản bóc lột.","C":"Cả ba câu đều đúng.","D":"Họ lao động trong nền công nghiệp có trình độ công nghệ và kỹ thuật hiện đại."},"correctAnswer":"C"},{"id":"q_47_45","number":47,"text":"Trong giai đoạn hiện nay, nhiều công nhân tại các tập đoàn cổ phần hóa mua lại cổ phiếu của doanh nghiệp và nhận cổ tức hằng năm. Phân tích thực trạng này, nhận định nào sau đây là chính xác?","options":{"A":"Công nhân đã trở thành nhà tư bản và làm thay đổi hoàn toàn bản chất của phương thức sản xuất.","B":"Giai cấp công nhân Việt Nam đã xóa bỏ xong quan hệ bóc lột giá trị thặng dư trong các doanh nghiệp.","C":"Bản chất bóc lột của chủ nghĩa tư bản đã bị triệt tiêu hoàn toàn trong nền kinh tế thị trường.","D":"Đây là biểu hiện của xu hướng \"trung lưu hóa\", cải thiện đời sống nhưng không làm mất đi địa vị làm thuê cốt lõi."},"correctAnswer":"D"},{"id":"q_48_46","number":48,"text":"Việc vận dụng lý luận về sứ mệnh lịch sử của GCCN vào điều kiện Việt Nam hiện nay đòi hỏi:","options":{"A":"Vận dụng sáng tạo, gắn lý luận Mác - Lênin với thực tiễn công nghiệp hóa, hiện đại hóa, phát triển kinh tế thị trường định hướng XHCN và hội nhập quốc tế.","B":"Chỉ tập trung giải quyết các vấn đề kinh tế trước mắt của công nhân và bỏ qua các định hướng chính trị - xã hội lâu dài của đất nước.","C":"Phủ nhận hoàn toàn các nguyên lý cơ bản của chủ nghĩa Mác - Lênin để xây dựng một quan điểm hoàn toàn mới không liên quan đến GCCN.","D":"Áp dụng máy móc tất cả các dự báo cụ thể của thế kỷ XIX vào thực tiễn Việt Nam mà không cần xem xét sự thay đổi của điều kiện lịch sử."},"correctAnswer":"A"},{"id":"q_49_47","number":49,"text":"Theo Nghị quyết số 02-NQ/TW của Bộ Chính trị về \"Đổi mới tổ chức và hoạt động của Công đoàn Việt Nam trong tình hình mới\", giải pháp đột phá để nâng cao vị thế và giữ vững vai trò nòng cốt của Công đoàn trước sự xuất hiện của các tổ chức đại diện người lao động tại doanh nghiệp là gì?","options":{"A":"Yêu cầu cơ quan nhà nước dùng biện pháp hành chính cấm thành lập các tổ chức đại diện người lao động ngoài Công đoàn.","B":"Miễn toàn bộ đoàn phí công đoàn và không tổ chức các phong trào thi đua lao động sản xuất tại doanh nghiệp.","C":"Tập trung thực hiện tốt chức năng đại diện, chăm lo, bảo vệ quyền và lợi ích hợp pháp, chính đáng của đoàn viên, người lao động.","D":"Chuyển giao toàn bộ nguồn tài chính công đoàn về Ngân sách nhà nước quản lý để chi trả trợ cấp thất nghiệp."},"correctAnswer":"C"},{"id":"q_50_48","number":50,"text":"Trong các doanh nghiệp tư nhân ở Việt Nam, việc thành lập tổ chức Công đoàn đôi khi gặp sự cản trở ngầm từ phía chủ doanh nghiệp. Phân tích dưới góc độ lý luận, thực trạng này phản ánh mâu thuẫn nào?","options":{"A":"Mâu thuẫn giữa giai cấp công nhân Việt Nam với bộ máy nhà nước pháp quyền XHCN.","B":"Mâu thuẫn giữa trình độ tay nghề của công nhân với yêu cầu công nghệ của nhà tư bản.","C":"Mâu thuẫn giữa xu hướng toàn cầu hóa kinh tế với mục tiêu bảo hộ lao động trong nước.","D":"Mâu thuẫn giữa lợi ích kinh tế của chủ sở hữu tư nhân với quyền lợi người lao động và tính tổ chức của GCCN."},"correctAnswer":"D"},{"id":"q_51_49","number":51,"text":"Trong bối cảnh hội nhập quốc tế và thực thi các Hiệp định thương mại tự do thế hệ mới (như CPTPP, EVFTA), Đảng và Nhà nước ta đề ra giải pháp nào để đổi mới tổ chức và hoạt động của Công đoàn Việt Nam?","options":{"A":"Hạn chế công nhân tham gia các tổ chức đại diện tại cơ sở để tránh nguy cơ đình công.","B":"Cho phép thành lập các công đoàn độc lập hoàn toàn thoát khỏi sự quản lý của pháp luật Việt Nam.","C":"Giải tán Công đoàn Việt Nam để thành lập bộ quản lý lao động trực thuộc Nhà nước.","D":"Đổi mới mạnh mẽ tổ chức, phương thức hoạt động, nâng cao năng lực đại diện, bảo vệ quyền lợi người lao động của Công đoàn."},"correctAnswer":"D"},{"id":"q_52_50","number":52,"text":"Một địa phương muốn nâng cao ý thức chính trị và vai trò xã hội của GCCN trong điều kiện hội nhập quốc tế. Phương hướng nào phù hợp nhất?","options":{"A":"Kết hợp giáo dục lý luận với thực tiễn lao động, phổ biến chính sách và pháp luật, nâng cao năng lực tổ chức, đồng thời tạo điều kiện để công nhân tham gia hoạt động tập thể hợp pháp.","B":"Tập trung giáo dục lý luận theo chương trình thống nhất, đồng thời đánh giá kết quả chủ yếu qua mức độ ghi nhớ khái niệm và nội dung chính sách.","C":"Ưu tiên các phong trào thi đua sản xuất, đồng thời để công nhân tự tìm hiểu các vấn đề chính trị - xã hội thông qua truyền thông đại chúng.","D":"Tăng cường giáo dục trách nhiệm cá nhân và kỷ luật lao động, đồng thời hạn chế nội dung liên quan đến quyền lợi tập thể để tránh ảnh hưởng sản xuất."},"correctAnswer":"A"},{"id":"q_53_51","number":53,"text":"Điều kiện chủ quan để giai cấp công nhân thực hiện sứ mệnh lịch sử của mình là gì?","options":{"A":"Giai cấp công nhân xây dựng được khối liên minh giai cấp với giai cấp nông dân các tầng lớp lao động khác.","B":"Sự phát triển của bản thân giai cấp công nhân về số lượng và chất lượng.","C":"Cả ba câu đều đúng.","D":"Giai cấp công nhân thành lập được chính Đảng của mình là Đảng Cộng sản."},"correctAnswer":"C"},{"id":"q_54_52","number":54,"text":"Trong một nhà máy, công nhân có kỹ năng số tốt nhưng ít hiểu biết về quyền lao động, chính sách an sinh và cơ chế đại diện tập thể. Vấn đề nào cần được nhận diện?","options":{"A":"Kỹ năng số chưa cao vì hiểu biết pháp luật và chính sách là điều kiện tiên quyết để sử dụng công nghệ trong sản xuất.","B":"Công nhân đã có đủ năng lực hiện đại hóa sản xuất, nên việc tìm hiểu quyền lao động có thể được xem là trách nhiệm riêng của tổ chức đại diện.","C":"Hiểu biết chính sách chưa cao chủ yếu phản ánh hạn chế của giáo dục phổ thông, không liên quan đến hoạt động của doanh nghiệp và tổ chức công đoàn.","D":"Phát triển GCCN cần kết hợp nâng cao trình độ chuyên môn với hiểu biết pháp luật, nhận thức chính trị - xã hội và năng lực bảo vệ quyền lợi hợp pháp."},"correctAnswer":"D"},{"id":"q_55_53","number":55,"text":"Nguyên nhân cơ bản nào làm cho giai cấp công nhân trở thành giai cấp có tinh thần cách mạng triệt để nhất?","options":{"A":"Vì họ có số lượng đông đảo nhất trong tất cả các tầng lớp lao động, không có tài sản và bị áp bức nặng nề nhất.","B":"Vì họ làm việc trong môi trường sản xuất công nghiệp tập trung với dây chuyền công nghệ mang tính xã hội hóa cao.","C":"Do tính chất xã hội hóa cao của lực lượng sản xuất hiện đại và bản chất bóc lột mang tính toàn cầu của chủ nghĩa tư bản quy định.","D":"Vì lợi ích cơ bản của họ đối lập trực tiếp với lợi ích của giai cấp tư bản và họ chỉ giải phóng mình khi giải phóng toàn xã hội."},"correctAnswer":"D"},{"id":"q_56_54","number":56,"text":"Giai cấp công nhân trong thời đại ngày nay có những điểm tương đồng so với giai cấp công nhân thế kỷ XIX?","options":{"A":"Ở các nước tư bản chủ nghĩa hiện nay giai cấp công nhân vẫn bị giai cấp tư sản và chủ nghĩa tư bản bóc lột giá trị thặng dư.","B":"Cả ba câu đều đúng.","C":"Xung đột lợi ích cơ bản giữa giai cấp tư sản và giai cấp công nhân (giữa tư bản và lao động) vẫn tồn tại, vẫn là nguyên nhân cơ bản, sâu xa của cuộc đấu tranh giai cấp trong xã hội hiện đại ngày nay.","D":"Giai cấp công nhân hiện nay vẫn là lực lượng sản xuất hàng đầu của xã hội hiện đại, là chủ thể của quá trình sản xuất công nghiệp hiện đại mang tính xã hội hóa ngày càng cao."},"correctAnswer":"B"},{"id":"q_57_55","number":57,"text":"Để phòng ngừa việc công nhân bị bóc lột sức lao động quá mức hoặc trả lương không tương xứng tại các doanh nghiệp, giải pháp quản lý nhà nước hiệu quả nhất là gì?","options":{"A":"Đóng cửa các doanh nghiệp có mức tỷ suất lợi nhuận cao hơn trung bình xã hội.","B":"Phân công cán bộ thanh tra đứng giám sát trực tiếp 24/7 tại từng dây chuyền sản xuất.","C":"Tăng cường thanh tra, kiểm tra lao động, xử lý nghiêm các vi phạm và hoàn thiện thể chế thương lượng tập thể.","D":"Áp dụng chính sách ấn định giá bán sản phẩm đầu ra cho các doanh nghiệp tư nhân."},"correctAnswer":"C"},{"id":"q_58_56","number":58,"text":"Theo lý luận Chủ nghĩa xã hội khoa học, mục tiêu cao nhất và triệt để nhất trong nội dung sứ mệnh lịch sử của giai cấp công nhân là gì?","options":{"A":"Xóa bỏ hoàn toàn chế độ tư hữu tư bản chủ nghĩa, giải phóng con người và xây dựng thành công xã hội chủ nghĩa, cộng sản chủ nghĩa.","B":"Đánh đổ sự trị vì của giai cấp tư sản, thực hiện công hữu toàn bộ tài sản tư nhân và phân chia bình đẳng mọi nguồn lực xã hội.","C":"Giành lấy chính quyền nhà nước, thiết lập nền chuyên chính vô sản và duy trì vĩnh viễn sự quản lý xã hội của giai cấp công nhân.","D":"Tăng năng suất lao động xã hội, cải thiện điều kiện sống vật chất và nâng cao vị thế chính trị cho người lao động làm thuê."},"correctAnswer":"A"},{"id":"q_59_57","number":59,"text":"Phương hướng giải pháp xây dựng giai cấp công nhân Việt Nam lớn mạnh gắn liền với việc xây dựng \"người công nhân hiện đại\". Yếu tố nào sau đây được xác định là đặc trưng cốt lõi của người công nhân hiện đại?","options":{"A":"Có giác ngộ giai cấp, tác phong công nghiệp, kỷ luật lao động, trình độ học vấn, kỹ năng nghề nghiệp và bản lĩnh.","B":"Không còn chịu sự quản lý, phân công hay điều hành sản xuất từ phía các nhà quản lý doanh nghiệp.","C":"Mức thu nhập tài chính cá nhân đứng ở nhóm cao nhất trong cơ cấu các tầng lớp dân cư xã hội.","D":"Sở hữu khối lượng cổ phần lớn để nắm quyền kiểm soát trực tiếp mọi hoạt động quản trị doanh nghiệp."},"correctAnswer":"A"},{"id":"q_60_58","number":60,"text":"Điểm khác biệt về bản chất giữa việc thực hiện sứ mệnh lịch sử của giai cấp công nhân với các cuộc cách mạng giai cấp trước đó trong lịch sử là gì?","options":{"A":"Thay thế chế độ tư hữu này bằng chế độ tư hữu khác tiến bộ hơn, nhằm duy trì quyền thống trị của giai cấp mới nắm chính quyền.","B":"Tập trung giải quyết các bất đồng chính trị nội bộ mà không cần thay đổi phương thức sản xuất và quan hệ sở hữu hiện hành.","C":"Triệt tiêu hoàn toàn chế độ chiếm hữu tư nhân về tư liệu sản xuất chủ yếu, giải phóng người lao động khỏi quan hệ bóc lột giai cấp.","D":"Sử dụng bộ máy nhà nước cũ để cải tạo nền kinh tế và thiết lập sự cào bằng tuyệt đối về thu nhập giữa các thành viên xã hội."},"correctAnswer":"C"},{"id":"q_61_59","number":61,"text":"Phân tích đặc điểm ra đời của giai cấp công nhân Việt Nam (ra đời trước giai cấp tư sản dân tộc, gắn liền với chính sách khai thác thuộc địa của Pháp), thực trạng phong trào công nhân Việt Nam thời kỳ hiện đại kế thừa yếu tố lịch sử nào?","options":{"A":"Xu hướng thỏa hiệp giai cấp để duy trì sự ổn định tạm thời trong các quan hệ lao động có yếu tố nước ngoài.","B":"Tâm lý sản xuất tiểu nông tự do và thói quen làm việc không tuân theo quy trình công nghệ hiện đại.","C":"Khả năng tự chủ tuyệt đối về mặt tài chính và tư liệu sản xuất ngay từ khi mới hình thành lực lượng.","D":"Bản lĩnh chính trị vững vàng, tinh thần yêu nước triệt để và truyền thống gắn bó mật thiết với nhân dân."},"correctAnswer":"D"},{"id":"q_62_60","number":62,"text":"Theo V.I. Lênin, quy luật hình thành và phát triển Đảng Cộng sản của giai cấp công nhân là gì?","options":{"A":"Chủ nghĩa Mác kết hợp với phong trào công nhân.","B":"Chủ nghĩa Mác - Lênin kết hợp với phong trào công nhân và phong trào yêu nước.","C":"Chủ nghĩa Mác - Lênin kết hợp với phong trào công nhân.","D":"Chủ nghĩa Mác kết hợp với phong trào nông nhân."},"correctAnswer":"A"},{"id":"q_63_61","number":63,"text":"Một số doanh nghiệp FDI tại Việt Nam áp dụng công nghệ tự động hóa hiện đại làm giảm quy mô lao động phổ thông, nhưng lại tăng nhu cầu tuyển dụng kỹ sư vận hành hệ thống thông minh. Thực trạng này phản ánh đặc điểm thực tế nào của giai cấp công nhân Việt Nam hiện nay?","options":{"A":"Sự phân hóa sâu sắc dẫn đến việc mất dần bản chất giai cấp của lực lượng lao động công nghiệp.","B":"Sự chuyển dịch hoàn toàn từ giai cấp công nhân sang tầng lớp trí thức trong nền kinh tế tri thức.","C":"Xu hướng trí thức hóa, nâng cao chất lượng lao động để thích ứng với Cách mạng công nghiệp 4.0.","D":"Sự suy giảm vai trò nòng cốt của giai cấp công nhân trong phát triển kinh tế thị trường định hướng XHCN."},"correctAnswer":"C"},{"id":"q_65_62","number":65,"text":"Về phương diện kinh tế - xã hội, nội dung sứ mệnh lịch sử của giai cấp công nhân được biểu hiện tập trung nhất qua nhiệm vụ nào sau đây?","options":{"A":"Là lực lượng trực tiếp nắm giữ và quản lý toàn bộ các nguồn lực sản xuất, triệt tiêu hoàn toàn các thành phần kinh tế phi xã hội chủ nghĩa.","B":"Là lực lượng nòng cốt trong việc nâng cao năng suất lao động, xóa bỏ hình thức trao đổi hàng hóa - tiền tệ để chuyển sang phân phối trực tiếp.","C":"Là chủ thể duy nhất vận hành nền sản xuất hiện đại, thực hiện phân phối sản phẩm xã hội theo nguyên tắc bình đẳng tuyệt đối cho mọi thành viên.","D":"Là nhân tố đại biểu cho phương thức sản xuất tiên tiến, xác lập quan hệ sản xuất mới dựa trên chế độ công hữu về tư liệu sản xuất chủ yếu."},"correctAnswer":"D"},{"id":"q_66_63","number":66,"text":"Sứ mệnh lịch sử của giai cấp công nhân do các yếu tố khách quan nào quy định?","options":{"A":"Do địa vị kinh tế - xã hội và chính trị - xã hội của giai cấp công nhân quy định.","B":"Do có lợi ích thống nhất nên giai cấp công nhân liên minh được với các giai cấp khác.","C":"Do giai cấp công nhân có được chính đảng của mình là Đảng Cộng sản.","D":"Do nền sản xuất công nghiệp phát triển nên giai cấp công nhân có sự phát triển mạnh mẽ về số lượng và chất lượng."},"correctAnswer":"A"},{"id":"q_67_64","number":67,"text":"Theo chủ nghĩa Mác - Lênin, điều kiện khách quan nào gắn trực tiếp với địa vị kinh tế - xã hội của GCCN trong CNTB?","options":{"A":"Giai cấp công nhân không hoặc cơ bản không sở hữu tư liệu sản xuất chủ yếu, phải bán sức lao động và gắn với lực lượng sản xuất hiện đại.","B":"Giai cấp công nhân chiếm tỷ lệ ngày càng lớn trong dân số nên tự nhiên trở thành lực lượng đại diện cho lợi ích của toàn bộ xã hội.","C":"Giai cấp công nhân có trình độ văn hóa cao hơn mọi lực lượng xã hội và vì thế có khả năng tự mình lãnh đạo toàn bộ quá trình phát triển xã hội.","D":"Giai cấp công nhân có mức sống thấp hơn tất cả các giai cấp và tầng lớp khác nên tất yếu phải tiến hành cách mạng xã hội chủ nghĩa."},"correctAnswer":"A"},{"id":"q_68_65","number":68,"text":"Đứng trước tác động của cuộc Cách mạng công nghiệp 4.0, đường lối của Đảng yêu cầu giai cấp công nhân Việt Nam phải thực hiện giải pháp thích ứng nào để không bị đào thải?","options":{"A":"Đòi hỏi Nhà nước cấm các doanh nghiệp đưa AI và robot vào thay thế con người trong sản xuất.","B":"Chủ động học tập suốt đời, nâng cao trình độ công nghệ thông tin, kỹ năng số và ngoại ngữ.","C":"Yêu cầu giảm giờ làm xuống một nửa nhưng giữ nguyên mức lương cơ bản.","D":"Chuyển dịch hàng loạt sang làm kinh tế nông nghiệp tiểu nông để bảo đảm an toàn việc làm."},"correctAnswer":"B"},{"id":"q_69_66","number":69,"text":"Đứng trước thực trạng nhiều doanh nghiệp tư nhân \"né tránh\" thành lập tổ chức Đảng, phương hướng giải pháp có tính đột phá của Đảng để tăng cường sự lãnh đạo đối với giai cấp công nhân tại các cơ sở này là gì?","options":{"A":"Áp dụng biện pháp rút giấy phép kinh doanh nếu doanh nghiệp không thành lập được chi bộ Đảng sau 1 năm.","B":"Phân công đảng viên là cán bộ công chức nhà nước sang làm việc cố định để kiêm nhiệm chức vụ tại công ty tư nhân.","C":"Quốc hữu hóa bắt buộc đối với tất cả các doanh nghiệp tư nhân có từ 500 lao động trở lên.","D":"Đổi mới phương thức hoạt động, phát triển đảng viên từ những công nhân ưu tú và chủ động đồng hành cùng doanh nghiệp."},"correctAnswer":"D"},{"id":"q_70_67","number":70,"text":"Giải pháp chính sách nào giúp người lao động công nhân nhập cư yên tâm gắn bó lâu dài với các khu công nghiệp tại các tỉnh, thành phố lớn?","options":{"A":"Yêu cầu công nhân phải quay về quê hương sinh sống sau khi hết hạn hợp đồng lao động 5 năm.","B":"Quy định công nhân nhập cư không được phép mua nhà ở cố định tại nơi làm việc.","C":"Miễn trừ hoàn toàn nghĩa vụ chấp hành quy định an ninh trật tự địa phương cho công nhân ngoại tỉnh.","D":"Cải cách thủ tục hành chính, bảo đảm bình đẳng trong tiếp cận các dịch vụ công (y tế, giáo dục, an sinh) cho lao động di cư."},"correctAnswer":"D"},{"id":"q_71_68","number":71,"text":"Trong một khu công nghiệp, công nhân có trình độ học vấn tăng lên, sử dụng thành thạo công nghệ số và tham gia cải tiến quy trình sản xuất. Một số ý kiến cho rằng GCCN đã bị “trí thức hóa” nên sứ mệnh lịch sử không còn phù hợp. Phân tích nào thuyết phục nhất?","options":{"A":"Sự phát triển tri thức của công nhân chỉ có ý nghĩa nâng cao năng suất, không ảnh hưởng đến cơ cấu, năng lực tổ chức và vai trò xã hội của GCCN.","B":"Trình độ học vấn tăng làm thay đổi bản chất giai cấp của công nhân, bởi sự phân biệt giai cấp chủ yếu dựa vào mức độ tri thức nghề nghiệp.","C":"Khi công nhân tham gia cải tiến công nghệ, họ đã trở thành lực lượng quản lý sản xuất và không còn chịu tác động của quan hệ lao động làm thuê.","D":"Trí thức hóa phản ánh sự thay đổi về trình độ và tính chất lao động, nhưng cần xem xét quan hệ sản xuất và vị trí giai cấp để đánh giá sứ mệnh lịch sử."},"correctAnswer":"D"},{"id":"q_72_69","number":72,"text":"Thực tế công nhân Việt Nam trong các doanh nghiệp công nghệ cao (như Viettel, VinFast...) làm chủ dây chuyền sản xuất phức tạp thể hiện khía cạnh lý luận nào về SMLS của GCCN?","options":{"A":"Sự biến đổi giai cấp công nhân thành giai cấp tư sản công nghệ trong nền kinh tế số.","B":"GCCN Việt Nam đã hoàn thành việc nâng cao trình độ ngang bằng với công nhân các nước phát triển.","C":"Việc bãi bỏ hoàn toàn sự phân biệt giữa lao động trí óc và lao động chân tay trong sản xuất.","D":"GCCN Việt Nam từng bước nâng cao chất lượng, làm chủ công nghệ tiên tiến, khẳng định vai trò lực lượng sản xuất hàng đầu."},"correctAnswer":"D"},{"id":"q_73_70","number":73,"text":"Mục tiêu cuối cùng của tất cả các phương hướng, giải pháp về xây dựng giai cấp công nhân Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội là nhằm đạt được điều gì?","options":{"A":"Biến Việt Nam thành quốc gia xuất khẩu nguồn lao động công nghiệp giá rẻ lớn nhất khu vực.","B":"Tạo điều kiện cho giai cấp công nhân trở thành giai cấp sở hữu nhiều tài sản tài chính nhất xã hội.","C":"Xây dựng GCCN Việt Nam lớn mạnh, là lực lượng nòng cốt thực hiện thành công sự nghiệp CNH, HĐH và xây dựng CNXH.","D":"Biến tất cả các giai tầng xã hội khác thành công nhân để xóa bỏ sự phân chia giai cấp trong thời gian ngắn nhất."},"correctAnswer":"C"},{"id":"q_74_71","number":74,"text":"Vì sao giai cấp công nhân là giai cấp có tính tổ chức và kỷ luật lao động cao nhất?","options":{"A":"Vì họ làm việc trong môi trường sản xuất công nghiệp tập trung với dây chuyền công nghệ mang tính xã hội hóa cao.","B":"Vì họ bị nhà tư bản ép buộc tuân thủ bằng các quy định nghiêm khắc.","C":"Vì lợi ích cơ bản của họ đối lập trực tiếp với lợi ích của giai cấp tư bản và họ chỉ giải phóng mình khi giải phóng toàn xã hội.","D":"Do tính chất xã hội hóa cao của lực lượng sản xuất hiện đại và bản chất bóc lột mang tính toàn cầu của chủ nghĩa tư bản quy định."},"correctAnswer":"A"},{"id":"q_75_72","number":75,"text":"Theo lý luận Chủ nghĩa xã hội khoa học, yếu tố nào sau đây đóng vai trò là điều kiện khách quan quy định sứ mệnh lịch sử của giai cấp công nhân?","options":{"A":"Việc thành lập được Đảng Cộng sản để đề ra đường lối cách mạng đúng đắn và tổ chức lãnh đạo phong trào đấu tranh.","B":"Địa vị kinh tế - xã hội của giai cấp công nhân gắn với phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại.","C":"Sự trưởng thành về bản lĩnh chính trị, ý thức giai cấp và trình độ chuyên môn kỹ thuật của lực lượng công nhân.","D":"Khả năng xây dựng khối liên minh bền vững giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp lao động khác."},"correctAnswer":"B"},{"id":"q_76_73","number":76,"text":"Theo lý luận Chủ nghĩa xã hội khoa học, đâu là thuộc tính cơ bản nhất xác định địa vị kinh tế - xã hội của giai cấp công nhân trong phương thức sản xuất tư bản chủ nghĩa?","options":{"A":"Là giai cấp duy nhất tạo ra toàn bộ giá trị sử dụng và của cải vật chất cho sự phát triển của xã hội hiện đại.","B":"Là giai cấp trực tiếp sở hữu công cụ lao động cải tiến và chịu trách nhiệm chính trong việc quản lý doanh nghiệp.","C":"Là giai cấp không có tư liệu sản xuất chủ yếu, phải bán sức lao động cho nhà tư bản và bị bóc lột giá trị thặng dư.","D":"Là giai cấp có số lượng đông đảo nhất, đại diện cho phong trào đấu tranh tự phát của nhân dân lao động nghèo khổ."},"correctAnswer":"C"},{"id":"q_77_74","number":77,"text":"Vì sao giai cấp công nhân là giai cấp triệt để cách mạng?","options":{"A":"Vì giai cấp công nhân là giai cấp không có tư liệu sản xuất.","B":"Vì giai cấp công nhân là giai cấp thực hiện xoá bỏ mọi chế độ tư hữu về tư liệu sản xuất.","C":"Vì giai cấp công nhân là giai cấp xoá bỏ chủ nghĩa tư bản và xây dựng chủ nghĩa xã hội.","D":"Vì giai cấp công nhân là giai cấp nghèo khổ nhất trong xã hội."},"correctAnswer":"B"},{"id":"q_78_75","number":78,"text":"Sự bùng nổ của các ứng dụng gọi xe, giao hàng công nghệ tại các đô thị lớn ở Việt Nam tạo ra lực lượng \"lao động nền tảng\" (Gig workers) đông đảo. Dưới góc độ lý luận SMLS của GCCN, thực trạng này đặt ra vấn đề chính trị - xã hội gì?","options":{"A":"Sự biến chất của nền kinh tế thị trường định hướng XHCN sang nền kinh tế tư bản chủ nghĩa tự do.","B":"Lực lượng này không còn thuộc giai cấp công nhân do họ tự sở hữu phương tiện lao động cá nhân.","C":"Tính chất lao động phân tán, thiếu sự liên kết truyền thống, gây khó khăn cho việc bảo vệ quyền lợi và tập hợp lực lượng.","D":"Quan hệ lao động làm thuê đã bị xóa bỏ hoàn toàn và thay thế bằng quan hệ đối tác bình đẳng tuyệt đối."},"correctAnswer":"C"},{"id":"q_79_76","number":79,"text":"Trước nguy cơ suy giảm tỷ lệ đoàn viên công đoàn tại các doanh nghiệp ngoài nhà nước, Công đoàn Việt Nam cần tập trung vào giải pháp chiến lược nào?","options":{"A":"Miễn hoàn toàn việc đóng đoàn phí và không tổ chức các hoạt động phong trào.","B":"Sử dụng biện pháp hành chính ép buộc người lao động phải viết đơn gia nhập công đoàn.","C":"Chuyển Công đoàn thành một cơ quan quản lý nhà nước thu phí dịch vụ lao động.","D":"Lấy chăm lo, bảo vệ quyền, lợi ích hợp pháp, chính đáng của người lao động làm trung tâm để thu hút đoàn viên tự nguyện tham gia."},"correctAnswer":"D"},{"id":"q_80_77","number":80,"text":"Theo lý luận Chủ nghĩa xã hội khoa học, nhân tố chủ quan nào giữ vai trò quyết định hàng đầu để giai cấp công nhân có thể chuyển từ đấu tranh tự phát sang đấu tranh tự giác và hoàn thành sứ mệnh lịch sử của mình?","options":{"A":"Sự phát triển vượt bậc về số lượng, chất lượng và trình độ giác ngộ giai cấp của bản thân lực lượng công nhân trong nền sản xuất.","B":"Giai cấp công nhân xây dựng được khối liên minh giai cấp với giai cấp nông dân các tầng lớp lao động khác.","C":"Sự ra đời và lãnh đạo của Đảng Cộng sản - đội tiên phong chiến đấu và là đại biểu trung thành cho lợi ích của giai cấp công nhân.","D":"Địa vị kinh tế - xã hội đặc thù và vai trò đại biểu cho lực lượng sản xuất tiến bộ nhất trong phương thức sản xuất hiện đại."},"correctAnswer":"C"},{"id":"q_81_78","number":81,"text":"Tìm ra câu đúng khi nói về giai cấp công nhân? Giai cấp công nhân:","options":{"A":"Cả ba câu đều đúng.","B":"Là sản phẩm và là chủ thể của nền sản xuất đại công nghiệp, là những người lao động trực tiếp hay gián tiếp vận hành các công cụ sản xuất có tính chất công nghiệp ngày càng hiện đại và xã hội hóa cao.","C":"Là những người phải bán sức lao động cho nhà tư bản và bị giai cấp tư sản bóc lột giá trị thặng dư.","D":"Là những người lao động không sở hữu tư liệu sản xuất chủ yếu của xã hội."},"correctAnswer":"A"},{"id":"q_82_79","number":82,"text":"Một địa phương muốn nâng cao chất lượng tổ chức đại diện người lao động tại doanh nghiệp. Phương án nào phù hợp nhất với mục tiêu bảo vệ quyền lợi hợp pháp và phát huy vai trò GCCN?","options":{"A":"Ưu tiên xử lý các vụ việc tranh chấp đã phát sinh, đồng thời hạn chế tham gia vào quá trình thương lượng để bảo đảm trung lập.","B":"Tăng số lượng hoạt động phong trào, đồng thời sử dụng tỷ lệ tham gia làm tiêu chí chính đánh giá chất lượng tổ chức đại diện.","C":"Nâng cao năng lực đại diện, thương lượng và hỗ trợ pháp lý; tăng tính thực chất của đối thoại và giám sát việc thực hiện thỏa thuận lao động.","D":"Tập trung vận động công nhân gia nhập tổ chức, đồng thời duy trì cơ chế hoạt động thống nhất để thuận lợi trong quản lý."},"correctAnswer":"C"},{"id":"q_83_80","number":83,"text":"Để củng cố khối liên minh công nhân - nông dân - trí thức trong thời kỳ quá độ lên CNXH ở Việt Nam, chính sách kinh tế của Nhà nước cần ưu tiên tập trung vào hướng giải pháp nào?","options":{"A":"Đẩy mạnh gắn kết giữa sản xuất công nghiệp, ứng dụng khoa học công nghệ với phát triển nông nghiệp hiện đại.","B":"Bắt buộc lực lượng trí thức phải trực tiếp tham gia lao động chân tay tại các trang trại và nhà máy.","C":"Tập trung toàn bộ nguồn lực đầu tư cho công nghiệp và cắt giảm ngân sách nông nghiệp.","D":"Phân phối cào bằng bình đẳng thu nhập giữa ba lực lượng bất kể năng suất lao động."},"correctAnswer":"A"},{"id":"q_84_81","number":84,"text":"Phương hướng giải pháp nào giúp giai cấp công nhân Việt Nam tham gia có hiệu quả vào quá trình hoạch định và giám sát việc thực thi chính sách, pháp luật của Nhà nước?","options":{"A":"Chuyển giao toàn bộ chức năng kiểm tra, thanh tra lao động cho Ban chấp hành công đoàn cơ sở đảm nhiệm.","B":"Yêu cầu mọi dự án luật trước khi ban hành phải được 100% công nhân tại các nhà máy biểu quyết thông qua.","C":"Trao quyền cho các hội nhóm công nhân tự phát được ban hành các văn bản quy phạm pháp luật lao động.","D":"Phát huy vai trò của Tổng Liên đoàn Lao động và Mặt trận Tổ quốc trong phản biện xã hội và lấy ý kiến công nhân."},"correctAnswer":"D"},{"id":"q_85_82","number":85,"text":"Theo lý luận Chủ nghĩa xã hội khoa học, phát biểu nào sau đây phản ánh đầy đủ và chính xác nhất nội dung sứ mệnh lịch sử tổng quát của giai cấp công nhân?","options":{"A":"Xóa bỏ triệt để quan hệ sản xuất tư bản chủ nghĩa, thiết lập chế độ công hữu đối với mọi loại tài sản trong đời sống xã hội.","B":"Đánh đổ bộ máy nhà nước tư sản, lãnh đạo khối đại đoàn kết toàn dân tộc nhằm xây dựng một xã hội bình đẳng không còn sự phân chia giai cấp.","C":"Lật đổ sự thống trị của giai cấp tư sản, giải phóng giai cấp công nhân và nhân dân lao động, xây dựng thành công chủ nghĩa xã hội và chủ nghĩa cộng sản.","D":"Giành chính quyền về tay người lao động, xóa bỏ ngay lập tức các hình thức tư hữu và thiết lập nền kinh tế thị trường định hướng xã hội chủ nghĩa."},"correctAnswer":"C"},{"id":"q_86_83","number":86,"text":"Việc một sản phẩm được thiết kế ở một quốc gia, sản xuất linh kiện ở nhiều quốc gia và lắp ráp tại một quốc gia khác phản ánh điều gì về GCCN?","options":{"A":"GCCN ngày càng bị phân tán theo không gian nhưng đồng thời có sự gắn kết thông qua các chuỗi sản xuất và phân công lao động toàn cầu.","B":"Toàn cầu hóa đã xóa bỏ sự khác biệt giữa người lao động và chủ sở hữu vì các doanh nghiệp quốc tế phân phối lợi ích đồng đều cho mọi quốc gia.","C":"Sự phân công lao động quốc tế làm GCCN mất khả năng liên kết vì người lao động ở mỗi quốc gia chỉ quan tâm đến lợi ích của doanh nghiệp trong nước.","D":"GCCN ở các quốc gia hoàn toàn không có lợi ích chung vì mỗi quốc gia tham gia một công đoạn sản xuất khác nhau trong chuỗi giá trị."},"correctAnswer":"A"},{"id":"q_87_84","number":87,"text":"Trước sự gia tăng của các quan hệ lao động linh hoạt (lao động tự do, lao động trên các nền tảng ứng dụng công nghệ), phương hướng giải pháp về mặt thể chế của Đảng và Nhà nước ta nhằm bảo vệ quyền lợi chính trị - xã hội của giai cấp công nhân là gì?","options":{"A":"Quy định mức lương tối thiểu riêng cho lao động công nghệ cao gấp đôi mức lương tối thiểu của lao động phổ thông.","B":"Bắt buộc các công ty công nghệ phải chuyển đổi mô hình kinh doanh thành các hợp tác xã do người lao động làm chủ.","C":"Sửa đổi, bổ sung Bộ luật Lao động và Luật Bảo hiểm xã hội nhằm mở rộng độ bao phủ an sinh cho mọi hình thức việc làm.","D":"Cấm sử dụng hình thức giao kết hợp đồng lao động ngắn hạn đối với các công việc có tính chất công nghệ."},"correctAnswer":"C"},{"id":"q_88_85","number":88,"text":"Điền từ còn thiếu vào chỗ trống vào câu sau: Giai cấp công nhân là cơ sở ..... của Đảng Cộng sản, là nguồn bổ sung lực lượng của Đảng Cộng sản.","options":{"A":"Chính trị - xã hội","B":"Xã hội - giai cấp.","C":"Chính trị","D":"Giai cấp"},"correctAnswer":"B"},{"id":"q_89_86","number":89,"text":"Trong một quốc gia, phong trào công nhân chuyển từ đấu tranh đòi quyền lợi kinh tế sang đấu tranh nhằm thay đổi quan hệ sản xuất và xây dựng một xã hội mới. Sự chuyển biến này phản ánh nội dung nào?","options":{"A":"Sự thay đổi từ đấu tranh của giai cấp công nhân sang đấu tranh của các tầng lớp trí thức, bởi chỉ trí thức mới có khả năng nhận thức mục tiêu xã hội lâu dài.","B":"Sự chuyển biến từ bảo vệ lợi ích người lao động sang theo đuổi mục tiêu phát triển kinh tế quốc gia mà không còn liên quan đến vấn đề giai cấp.","C":"Sự chuyển từ hoạt động kinh tế sang hoạt động chính trị đơn thuần, trong đó lợi ích kinh tế của người lao động không còn giữ vai trò quan trọng.","D":"Sự chuyển từ đấu tranh tự phát sang đấu tranh tự giác, gắn lợi ích trước mắt với mục tiêu chính trị - xã hội lâu dài của giai cấp công nhân."},"correctAnswer":"D"},{"id":"q_90_87","number":90,"text":"Theo lý luận Mác - Lênin, mục tiêu cuối cùng của sứ mệnh lịch sử của giai cấp công nhân được thể hiện đầy đủ nhất ở phương án nào?","options":{"A":"Xóa bỏ chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất, xóa bỏ áp bức, bóc lột và hướng tới giải phóng con người một cách toàn diện.","B":"Tập trung phát triển lực lượng sản xuất, mở rộng công nghiệp hóa và hiện đại hóa để nâng cao mức sống mà không nhất thiết phải thay đổi quan hệ sản xuất.","C":"Giành quyền kiểm soát các doanh nghiệp lớn và từng bước nâng cao thu nhập của người lao động trong nền kinh tế hiện đại.","D":"Xây dựng một xã hội trong đó giai cấp công nhân trở thành lực lượng có quyền lực kinh tế và chính trị cao hơn các giai cấp khác."},"correctAnswer":"A"},{"id":"q_91_88","number":91,"text":"So với giai cấp công nhân ở thế kỷ XIX, giai cấp công nhân trong thời đại ngày nay có những biến đổi và khác biệt gì?","options":{"A":"Ở các nước tư bản chủ nghĩa, tài sản, mức sống, điều kiện sống, trình độ học vấn và văn hóa nói chung của giai cấp công nhân sự thay đổi.","B":"Xuất hiện xu hướng “trí thức hóa” và “trung lưu hóa” giai cấp công nhân.","C":"Cả ba câu đều đúng.","D":"Ở các nước đang trên con đường phát triển theo định hướng xã hội chủ nghĩa, giai cấp công nhân đã trở thành giai cấp cầm quyền và là chủ sở hữu các tư liệu sản xuất chủ yếu của xã hội."},"correctAnswer":"C"},{"id":"q_92_89","number":92,"text":"Sự xuất hiện ngày càng đông đảo của lực lượng lao động di động (như tài xế ứng dụng công nghệ, nhân viên giao hàng qua nền tảng số) tại các đô thị lớn ở Việt Nam đặt ra yêu cầu gì khi vận dụng khái niệm GCCN Việt Nam hiện nay?","options":{"A":"Cần loại bỏ lực lượng này ra khỏi khái niệm GCCN vì họ tự sở hữu phương tiện lao động cá nhân là xe máy.","B":"Cần xác định lực lượng này là tầng lớp thương nhân tự do vì họ tự quyết định thời gian lao động hằng ngày.","C":"Cần mở rộng phạm vi khái niệm GCCN để bao hàm cả những hình thức lao động làm thuê mới dựa trên nền tảng công nghệ.","D":"Cần coi lực lượng này là giai cấp nông dân vì đại đa số họ có nguồn gốc xuất thân từ các vùng nông thôn."},"correctAnswer":"C"},{"id":"q_93_90","number":93,"text":"Nội dung sứ mệnh lịch sử của giai cấp công nhân ở các nước theo định hướng xã hội chủ nghĩa trên phương diện chính trị - tư tưởng được thể hiện qua yếu tố nào sau đây?","options":{"A":"Chống lại sự áp bức, bất công xã hội, thu hẹp khoảng cách giàu nghèo và bảo vệ quyền lợi của người lao động.","B":"Giữ vững sự lãnh đạo của Đảng Cộng sản, bảo vệ nền tảng tư tưởng Mác - Lênin và xây dựng văn hóa mới xã hội chủ nghĩa.","C":"Đấu tranh chống lại sự bóc lột giá trị thặng dư tinh vi của tư bản và đòi hỏi sự phân phối công bằng hơn về kết quả sản xuất.","D":"Giữ vai trò nòng cốt trong sự nghiệp công nghiệp hóa, hiện đại hóa và phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa."},"correctAnswer":"B"},{"id":"q_94_91","number":94,"text":"Một số công nhân tại doanh nghiệp có vốn đầu tư nước ngoài nhận lương, thưởng và phúc lợi khá tốt; tuy nhiên, họ ít có quyền tham gia quyết định chiến lược sản xuất. Từ góc độ quan hệ giai cấp, cần nhận diện điều gì?","options":{"A":"Sự khác biệt về quyền quản lý chỉ phản ánh phân công lao động trong doanh nghiệp, không liên quan đến vị trí của công nhân trong quan hệ sản xuất.","B":"Việc không tham gia quyết định chiến lược sản xuất cho thấy công nhân chưa trở thành lực lượng sản xuất hiện đại, dù họ trực tiếp vận hành công nghệ tiên tiến.","C":"Thu nhập và phúc lợi cao cho thấy lợi ích giữa người lao động và chủ sở hữu đã thống nhất về cơ bản, nên vấn đề quan hệ giai cấp không còn nổi bật.","D":"Điều kiện sống được cải thiện có thể làm thay đổi biểu hiện của mâu thuẫn lợi ích, nhưng không tự động xóa bỏ khác biệt về quyền sở hữu và kiểm soát sản xuất."},"correctAnswer":"D"},{"id":"q_95_92","number":95,"text":"Vì sao chủ nghĩa Mác - Lênin xác định nông dân là lực lượng cách mạng quan trọng nhưng không phải lực lượng giữ vai trò lãnh đạo cách mạng xã hội chủ nghĩa?","options":{"A":"Vì lợi ích của nông dân hoàn toàn đối lập với GCCN nên hai lực lượng này chỉ có thể hợp tác trong những thời kỳ cách mạng đặc biệt.","B":"Vì nông dân chủ yếu làm việc trong lĩnh vực nông nghiệp nên không có khả năng tham gia các hoạt động chính trị và không thể trở thành lực lượng cách mạng.","C":"Vì nông dân có số lượng đông nhưng thường phân tán trong sản xuất, gắn với sở hữu nhỏ và không trực tiếp đại diện cho phương thức sản xuất công nghiệp hiện đại.","D":"Vì nông dân chỉ có vai trò hỗ trợ kinh tế cho GCCN và không có khả năng tham gia vào các hoạt động xã hội, chính trị và xây dựng đất nước."},"correctAnswer":"C"},{"id":"q_96_93","number":96,"text":"Điểm khác biệt căn bản giữa sứ mệnh lịch sử của GCCN và vai trò lịch sử của giai cấp tư sản là gì?","options":{"A":"Giai cấp tư sản từng có vai trò cách mạng trong việc phát triển lực lượng sản xuất nhưng về sau trở thành lực lượng bảo vệ quan hệ sản xuất tư bản chủ nghĩa.","B":"Giai cấp tư sản không có bất kỳ vai trò tiến bộ nào trong lịch sử, trong khi GCCN luôn giữ vai trò cách mạng trong mọi giai đoạn phát triển xã hội.","C":"GCCN chỉ có nhiệm vụ cải thiện điều kiện lao động còn giai cấp tư sản mới có khả năng xây dựng những phương thức sản xuất hiện đại.","D":"Hai giai cấp có sứ mệnh lịch sử giống nhau nhưng khác nhau chủ yếu ở phương thức tổ chức sản xuất và trình độ phát triển kinh tế."},"correctAnswer":"A"},{"id":"q_97_94","number":97,"text":"Yếu tố nào dưới đây là căn cứ quan trọng nhất để bác bỏ quan điểm cho rằng giai cấp công nhân đang biến mất?","options":{"A":"Nhiều quốc gia vẫn có số lượng lớn người làm việc trong khu vực sản xuất công nghiệp truyền thống.","B":"Tỷ lệ lao động có trình độ đại học trong lực lượng lao động ngày càng tăng ở nhiều quốc gia.","C":"Người lao động trong nhiều lĩnh vực mới vẫn không sở hữu tư liệu sản xuất và sống chủ yếu bằng việc bán sức lao động.","D":"Một bộ phận công nhân đã trở thành cổ đông nhỏ trong doanh nghiệp nơi mình làm việc."},"correctAnswer":"C"},{"id":"q_98_95","number":98,"text":"Một doanh nghiệp nền tảng sử dụng người lao động giao hàng theo đơn, trả tiền theo sản phẩm và không bảo đảm đầy đủ các chế độ như lao động hợp đồng truyền thống. Khi phân tích vị trí xã hội của nhóm này, cách tiếp cận nào phù hợp nhất?","options":{"A":"Xếp lao động nền tảng thành một giai cấp mới độc lập vì hình thức sử dụng ứng dụng số đã làm thay đổi căn bản mọi quan hệ lao động.","B":"Xếp toàn bộ lao động nền tảng vào tầng lớp tiểu chủ vì họ có thể tự lựa chọn thời gian làm việc và phương tiện lao động.","C":"Xem xét quan hệ sở hữu, mức độ lệ thuộc vào nền tảng, quyền kiểm soát công việc và cách thức tạo thu nhập để xác định vị trí giai cấp.","D":"Xếp toàn bộ lao động nền tảng vào giai cấp công nhân công nghiệp vì hoạt động của họ trực tiếp phục vụ quá trình lưu thông hàng hóa."},"correctAnswer":"C"},{"id":"q_99_96","number":99,"text":"Nghị quyết số 20-NQ/TW của Ban Chấp hành Trung ương Đảng khóa X xác định giải pháp then chốt để xây dựng giai cấp công nhân Việt Nam thời kỳ CNH, HĐH là gì?","options":{"A":"Chuyển giao toàn bộ các doanh nghiệp nhà nước cho tập thể công nhân tự quản lý.","B":"Tăng tiền lương tối thiểu hằng năm mà không cần gắn với tăng năng suất lao động xã hội.","C":"Đào tạo, bồi dưỡng, nâng cao trình độ học vấn, chuyên môn, kỹ năng nghề nghiệp và bản lĩnh chính trị cho công nhân.","D":"Hạn chế tối đa việc thu hút đầu tư nước ngoài để bảo vệ thị trường lao động trong nước."},"correctAnswer":"C"},{"id":"q_100_97","number":100,"text":"Thực trạng chuyển dịch lao động từ các khu vực kinh tế nhà nước sang khu vực kinh tế tư nhân và FDI tại Việt Nam phản ánh sự biến đổi nào của GCCN?","options":{"A":"Sự suy thoái về bản chất giai cấp công nhân do làm việc cho các chủ tư bản nước ngoài.","B":"Sự mất đi vai trò đại biểu cho phương thức sản xuất tiên tiến của giai cấp công nhân.","C":"Việc Nhà nước không còn giữ vai trò chủ đạo trong nền kinh tế thị trường định hướng XHCN.","D":"Sự suy giảm tỷ trọng công nhân trong khu vực nhà nước nhưng gia tăng sự đa dạng về môi trường làm việc của GCCN."},"correctAnswer":"D"},{"id":"q_101_98","number":101,"text":"Tìm ra câu sai trong những câu sau. Điều kiện chủ quan để giai cấp công nhân thực hiện sứ mệnh lịch sử của mình là gì?","options":{"A":"Giai cấp công nhân xây dựng được khối liên minh giai cấp với giai cấp nông dân các tầng lớp lao động khác.","B":"Giai cấp công nhân là con đẻ, là sản phẩm của nền đại công nghiệp là chủ thể của quá trình sản xuất vật chất hiện đại, đại diện cho phương thức sản xuất tiên tiến và lực lượng sản xuất hiện đại.","C":"Giai cấp công nhân thành lập được chính Đảng của mình là Đảng Cộng sản.","D":"Giai cấp công nhân luôn phát triển về số lượng và chất lượng."},"correctAnswer":"B"},{"id":"q_102_99","number":102,"text":"Một số công nhân trẻ có trình độ chuyên môn cao chuyển sang làm việc trong các lĩnh vực dịch vụ công nghệ, logistics và vận hành nền tảng. Khi đánh giá cơ cấu GCCN hiện nay, nhận định nào phù hợp nhất?","options":{"A":"Cơ cấu GCCN cần được xem xét theo sự biến đổi của ngành nghề và quan hệ lao động, không giới hạn ở công nhân trong nhà máy truyền thống.","B":"Những người làm việc ngoài nhà máy không thể thuộc GCCN vì không trực tiếp tham gia sản xuất vật chất trong các dây chuyền công nghiệp.","C":"Cơ cấu ngành nghề mở rộng chứng minh ranh giới giữa GCCN và các giai cấp khác đã mất hoàn toàn ý nghĩa trong nền kinh tế số.","D":"Việc chuyển sang ngành dịch vụ cho thấy GCCN đang thu hẹp về bản chất, bởi chỉ lao động trực tiếp mới tạo ra giá trị kinh tế."},"correctAnswer":"A"},{"id":"q_103_100","number":103,"text":"Khi đánh giá thực trạng GCCN Việt Nam trong thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa, cách tiếp cận nào toàn diện nhất?","options":{"A":"Đánh giá chủ yếu qua mức độ hiện đại của công nghệ sản xuất và năng suất lao động, vì các yếu tố này quyết định đầy đủ chất lượng của GCCN.","B":"Ưu tiên các chỉ số tiền lương, phúc lợi và trình độ học vấn vì đây là những yếu tố phản ánh trực tiếp khả năng thực hiện sứ mệnh lịch sử.","C":"Tập trung vào quy mô lực lượng lao động, tốc độ tăng việc làm và tỷ trọng công nghiệp để xác định mức độ phát triển của GCCN.","D":"Kết hợp xem xét số lượng, chất lượng, cơ cấu, việc làm, đời sống, trình độ chính trị - xã hội, khả năng làm chủ công nghệ và vị trí trong quan hệ sản xuất."},"correctAnswer":"D"},{"id":"q_104_101","number":104,"text":"Khi xây dựng chương trình phát triển GCCN Việt Nam trong giai đoạn mới, địa phương cần lựa chọn hệ thống giải pháp nào thể hiện đầy đủ nhất mối quan hệ giữa phát triển GCCN và thực hiện sứ mệnh lịch sử?","options":{"A":"Ưu tiên tăng số lượng công nhân, mở rộng các khu công nghiệp và cải thiện chỉ tiêu tuyển dụng để củng cố vị trí của GCCN trong nền kinh tế.","B":"Kết hợp nâng cao trình độ, kỹ năng, ý thức chính trị, tổ chức đại diện, điều kiện sống và năng lực tham gia phát triển lực lượng sản xuất hiện đại.","C":"Ưu tiên hiện đại hóa công nghệ và tăng năng suất, đồng thời để cơ chế thị trường tự điều chỉnh chất lượng lao động và quan hệ lợi ích.","D":"Tập trung nâng cao thu nhập và phúc lợi, đồng thời duy trì cơ cấu nghề nghiệp hiện có để bảo đảm ổn định đời sống của người lao động."},"correctAnswer":"B"},{"id":"q_105_102","number":105,"text":"Điểm đặc thù mang tính lịch sử về sự ra đời của giai cấp công nhân Việt Nam so với giai cấp công nhân ở các nước tư bản phương Tây là gì?","options":{"A":"Ra đời sau khi giai cấp tư sản dân tộc đã thành lập được các tổ chức chính trị và nắm giữ vai trò lãnh đạo nền kinh tế đất nước.","B":"Ra đời trước giai cấp tư sản dân tộc, gắn liền với chính sách khai thác thuộc địa của thực dân Pháp và sớm tiếp thu chủ nghĩa Mác - Lênin.","C":"Ra đời từ sự phát triển tự nhiên của nền kinh tế hàng hóa nội địa, hình thành trước khi thực dân Pháp tiến hành xâm lược Việt Nam.","D":"Ra đời đồng thời với giai cấp tư sản dân tộc, xuất thân chủ yếu từ nông dân nghèo bị tước đoạt toàn bộ tư liệu sản xuất nông nghiệp."},"correctAnswer":"B"},{"id":"q_106_103","number":106,"text":"Nhằm bảo vệ quyền lợi của lực lượng \"lao động nền tảng\" (Gig workers) đang tăng nhanh, giải pháp thể chế chính sách cấp thiết nhất của Nhà nước Việt Nam hiện nay là gì?","options":{"A":"Ép buộc các công ty công nghệ phải chuyển giao toàn bộ cổ phần cho người lao động.","B":"Cấm hoàn toàn hoạt động của các nền tảng công nghệ giao hàng và gọi xe trực tuyến.","C":"Quy định tất cả tài xế công nghệ là công chức nhà nước hưởng lương từ ngân sách.","D":"Bổ sung, hoàn thiện khung pháp lý về lao động, an sinh xã hội phù hợp với các hình thức việc làm mới."},"correctAnswer":"D"},{"id":"q_107_104","number":107,"text":"Trong thời kỳ cách mạng dân tộc dân chủ nhân dân, sứ mệnh lịch sử hàng đầu của giai cấp công nhân Việt Nam được xác định là gì?","options":{"A":"Giành độc lập dân tộc, giải phóng giai cấp và nhân dân lao động khỏi sự áp bức, thống trị của thực dân, phong kiến.","B":"Bãi bỏ nền kinh tế tiểu nông truyền thống để tiến thẳng lên xây dựng nền đại công nghiệp hiện đại ngay trong chiến tranh.","C":"Xóa bỏ ngay lập tức các hình thức bóc lột phong kiến, thực hiện cải cách ruộng đất để chia đều tư liệu sản xuất cho nông dân.","D":"Tuyên bố thành lập chính quyền chuyên chính vô sản thuần túy công nhân và triệt tiêu các đảng phái chính trị phi cộng sản."},"correctAnswer":"A"},{"id":"q_108_105","number":108,"text":"Về mặt kinh tế - xã hội, quy luật vận động khách quan nào trong phương thức sản xuất tư bản chủ nghĩa quy định giai cấp công nhân là lực lượng quyết định việc xóa bỏ chủ nghĩa tư bản?","options":{"A":"Mâu thuẫn giữa xu hướng tự động hóa trong quy trình sản xuất với nguy cơ suy giảm lợi nhuận ròng của các nhà đầu tư tư bản.","B":"Mâu thuẫn giữa tính chất xã hội hóa ngày càng cao của lực lượng sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất.","C":"Mâu thuẫn giữa nhu cầu mở rộng thị trường tiêu thụ của các tập đoàn xuyên quốc gia với khả năng thanh toán thực tế của người lao động.","D":"Mâu thuẫn giữa trình độ công nghệ tiên tiến trong các xưởng máy với trình độ quản trị doanh nghiệp lạc hậu của giai cấp tư sản."},"correctAnswer":"B"},{"id":"q_109_106","number":109,"text":"Điều nào giải thích thuyết phục nhất vì sao học thuyết về sứ mệnh lịch sử của giai cấp công nhân vẫn còn giá trị trong bối cảnh hiện nay?","options":{"A":"Vì mọi quốc gia trên thế giới đều đã lựa chọn con đường phát triển xã hội chủ nghĩa.","B":"Vì khoa học và công nghệ phát triển đã làm mất hoàn toàn sự khác biệt giữa các giai cấp.","C":"Vì những mâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa vẫn tồn tại dưới những hình thức mới.","D":"Vì lực lượng công nhân công nghiệp hiện nay đông hơn nhiều so với thế kỷ XIX."},"correctAnswer":"C"},{"id":"q_110_107","number":110,"text":"Thực trạng một số công nhân trẻ bị ảnh hưởng bởi tư tưởng thực dụng, lối sống gấp, ít quan tâm đến chính trị phản ánh hạn chế nào trong phát triển GCCN Việt Nam?","options":{"A":"Việc giai cấp công nhân đã chuyển sang giai cấp tiểu tư sản trong xã hội hiện đại.","B":"Sự suy thoái không thể đảo ngược về mặt đạo đức của giai cấp lãnh đạo cách mạng.","C":"Sự tác động tiêu cực duy nhất từ nền kinh tế tri thức đến tâm lý người lao động.","D":"Hạn chế về bản lĩnh chính trị, giác ngộ giai cấp và công tác giáo dục tư tưởng văn hóa."},"correctAnswer":"D"},{"id":"q_111_108","number":111,"text":"Tại sao địa vị kinh tế - xã hội của giai cấp công nhân trong hệ thống sản xuất tư bản chủ nghĩa lại tạo ra khả năng khách quan giúp họ trở thành giai cấp lãnh đạo cách mạng?","options":{"A":"Vì họ là giai cấp chiếm đa số tuyệt đối trong cơ cấu dân cư ở tất cả các quốc gia trên thế giới ngay từ khi chủ nghĩa tư bản ra đời.","B":"Vì họ là giai cấp nghèo khổ nhất, chịu nhiều bất công nhất nên có khát vọng giải phóng xã hội mạnh mẽ hơn các giai tầng khác.","C":"Vì họ là lực lượng duy nhất có khả năng tích lũy tài chính để mua lại các nhà máy và tự quản lý nền kinh tế xã hội chủ nghĩa.","D":"Vì họ là lực lượng lao động gắn liền với phương thức sản xuất tiên tiến, trực tiếp vận hành lực lượng sản xuất có tính xã hội hóa ngày càng cao."},"correctAnswer":"D"},{"id":"q_112_109","number":112,"text":"Điểm khác biệt của giai cấp công nhân hiện đại so với công nhân thế kỷ XIX là gì?","options":{"A":"Phong trào cộng sản và công nhân ở nhiều nước luôn là lực lượng đi đầu trong các cuộc đấu tranh vì hòa bình, hợp tác và phát triển.","B":"Tồn tại xung đột về lợi ích cơ bản giữa giai cấp tư sản và giai cấp công nhân.","C":"Giai cấp công nhân là lực lượng sản xuất hàng đầu của xã hội hiện đại.","D":"Giai cấp công nhân gắn liền với cách mạng khoa học và công nghệ hiện đại, với sự phát triển kinh tế tri thức, có xu hướng trí tuệ hoá."},"correctAnswer":"D"},{"id":"q_113_110","number":113,"text":"Theo lý luận Chủ nghĩa xã hội khoa học, điều gì giải thích bản chất quốc tế của giai cấp công nhân và phong trào công nhân một cách thuyết phục nhất?","options":{"A":"Do sự chỉ đạo tập trung thống nhất từ một tổ chức chính trị quốc tế duy nhất đối với phong trào công nhân ở tất cả các nước.","B":"Do nhu cầu tự phát của người lao động làm thuê nhằm hỗ trợ tài chính cho các cuộc bãi công của công nhân ở nước ngoài.","C":"Do tính chất xã hội hóa cao của lực lượng sản xuất hiện đại và bản chất bóc lột mang tính toàn cầu của chủ nghĩa tư bản quy định.","D":"Do yêu cầu hợp tác kinh tế quốc tế nhằm thúc đẩy xu hướng toàn cầu hóa và tự do hóa thương mại giữa các quốc gia."},"correctAnswer":"C"},{"id":"q_114_111","number":114,"text":"Ở các nước đang trong thời kỳ quá độ lên chủ nghĩa xã hội (như Việt Nam), nội dung sứ mệnh lịch sử của giai cấp công nhân trên lĩnh vực kinh tế được xác định là gì?","options":{"A":"Đấu tranh chống lại sự bóc lột giá trị thặng dư tinh vi của tư bản và đòi hỏi sự phân phối công bằng hơn về kết quả sản xuất.","B":"Giữ vai trò nòng cốt trong sự nghiệp công nghiệp hóa, hiện đại hóa và phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa.","C":"Chống lại sự áp bức, bất công xã hội, thu hẹp khoảng cách giàu nghèo và bảo vệ quyền lợi của người lao động.","D":"Đấu tranh chống lại sự bất công xã hội, bảo vệ quyền lợi người lao động và xây dựng các giá trị văn hóa tiến bộ, nhân văn."},"correctAnswer":"B"},{"id":"q_115_112","number":115,"text":"Việc một bộ phận công nhân ở các nước tư bản được hưởng chế độ bảo hiểm, phúc lợi và tiền lương tương đối cao nên được đánh giá như thế nào?","options":{"A":"Đây là những điều chỉnh của chủ nghĩa tư bản có thể cải thiện đời sống người lao động nhưng không đồng nghĩa với việc xóa bỏ những quan hệ sản xuất cơ bản của CNTB.","B":"Đây là dấu hiệu cho thấy GCCN đã trở thành giai cấp tư sản vì người lao động đã được h
