ưởng một phần thành quả của doanh nghiệp.","C":"Đây là bằng chứng cho thấy quan hệ giai cấp và quan hệ lao động làm thuê đã hoàn toàn biến mất trong chủ nghĩa tư bản hiện đại.","D":"Đây là bằng chứng cho thấy GCCN không còn có lợi ích riêng và đã hoàn toàn thống nhất lợi ích kinh tế với giai cấp tư sản."},"correctAnswer":"A"},{"id":"q_116_113","number":116,"text":"Phương hướng giải pháp nào giúp giai cấp công nhân Việt Nam tham gia có hiệu quả vào quá trình hoạch định và giám sát việc thực thi chính sách, pháp luật của Nhà nước?","options":{"A":"Chuyển giao toàn bộ chức năng kiểm tra, thanh tra lao động cho Ban chấp hành công đoàn cơ sở đảm nhiệm.","B":"Phát huy vai trò của Tổng Liên đoàn Lao động và Mặt trận Tổ quốc trong phản biện xã hội và lấy ý kiến công nhân.","C":"Trao quyền cho các hội nhóm công nhân tự phát được ban hành các văn bản quy phạm pháp luật lao động.","D":"Yêu cầu mọi dự án luật trước khi ban hành phải được 100% công nhân tại các nhà máy biểu quyết thông qua."},"correctAnswer":"B"},{"id":"q_117_114","number":117,"text":"Việc các thế lực thù địch lợi dụng các vụ tranh chấp lao động để kích động người biểu tình, gây rối an ninh trật tự tại một số địa phương phản ánh nguy cơ thực tiễn nào?","options":{"A":"Âm mưu \"diễn biến hòa bình\", lợi dụng vấn đề lao động để chia rẽ GCCN với Đảng và Nhà nước.","B":"Sự biến chất hoàn toàn của phong trào công nhân Việt Nam sang phong trào vô chính phủ.","C":"Sự lũng đoạn hoàn toàn của các tập đoàn tư bản đối với đời sống chính trị Việt Nam.","D":"Sự bất lực của lực lượng công an trong việc bảo vệ trật tự an toàn xã hội tại khu công nghiệp."},"correctAnswer":"A"},{"id":"q_118_115","number":118,"text":"Việc xuất hiện ngày càng nhiều kỹ sư CNTT, chuyên gia điều khiển tự động hóa làm việc trong các khu công nghệ cao ở Hà Nội, TP.HCM, Đà Nẵng phản ánh xu hướng thực tiễn nào của GCCN Việt Nam?","options":{"A":"Xu hướng hòa tan giai cấp công nhân vào các thành phần kinh tế phi xã hội chủ nghĩa.","B":"Xu hướng trí thức hóa giai cấp công nhân, gắn liền với lực lượng sản xuất hiện đại và kinh tế tri thức.","C":"Xu hướng từ bỏ vai trò nòng cốt chính trị để tập trung hoàn toàn vào hoạt động nghiên cứu thuần túy.","D":"Xu hướng tách rời khỏi phong trào công nhân để gia nhập tầng lớp tiểu tư sản trí thức."},"correctAnswer":"B"},{"id":"q_119_116","number":119,"text":"Yếu tố khách quan nào trong môi trường lao động đại công nghiệp quy định giai cấp công nhân có được tính tổ chức, kỷ luật cao và tinh thần đoàn kết giai cấp?","options":{"A":"Yêu cầu hợp tác chặt chẽ, tuân thủ quy trình nghiêm ngặt của dây chuyền sản xuất có tính chất xã hội hóa cao trong các nhà máy.","B":"Ý thức tự giác giác ngộ lý luận Mác - Lênin được hình thành ngay khi người lao động bước chân vào làm việc tại doanh nghiệp.","C":"Sự cạnh tranh gay gắt về việc làm giữa các lực lượng lao động làm thuê đòi hỏi họ phải tự liên kết để giữ mức lương.","D":"Sự quản lý độc đoán và các hình thức xử phạt khắc nghiệt từ phía các chủ tư bản nhằm áp đặt trật tự lao động khắt khe."},"correctAnswer":"A"},{"id":"q_120_117","number":120,"text":"Để nâng cao hiệu quả công tác đấu tranh phản bác các quan điểm sai trái, xuyên tạc về sứ mệnh lịch sử của giai cấp công nhân trong bối cảnh bùng nổ thông tin trên mạng xã hội, giải pháp tuyên truyền của Đảng yêu cầu tập trung vào hướng nào?","options":{"A":"Giao toàn bộ nhiệm vụ bảo vệ nền tảng tư tưởng cho lực lượng công an và quân đội đảm nhiệm chuyên trách.","B":"Bãi bỏ việc thảo luận các chủ đề chính trị - xã hội nhạy cảm trong các buổi sinh hoạt công đoàn cơ sở.","C":"Xây dựng các kênh truyền thông số chính thống, hiện đại, phát huy vai trò nòng cốt của lực lượng công nhân tri thức.","D":"Cấm người lao động sử dụng các mạng xã hội nước ngoài trong thời gian làm việc tại các khu công nghiệp."},"correctAnswer":"C"},{"id":"q_121_118","number":121,"text":"Một bộ phận công nhân làm việc thông qua nền tảng số, nhận việc theo đơn hàng, tự trang bị phương tiện và chịu sự đánh giá của thuật toán. Khi xác định vị trí giai cấp của họ, cách tiếp cận nào phù hợp nhất?","options":{"A":"Xem họ là một giai cấp mới độc lập vì thuật toán đã thay thế hoàn toàn những quan hệ lao động truyền thống.","B":"Phân tích mức độ lệ thuộc vào nền tảng, quyền kiểm soát công việc, cách thức tạo thu nhập và quan hệ sở hữu để xác định vị trí xã hội của họ.","C":"Xếp họ vào GCCN công nghiệp vì mọi hoạt động tạo ra giá trị kinh tế trên nền tảng số đều thuộc sản xuất công nghiệp hiện đại.","D":"Xếp họ vào tầng lớp tiểu chủ vì sở hữu phương tiện lao động cá nhân và có thể chủ động lựa chọn thời gian làm việc."},"correctAnswer":"B"},{"id":"q_122_119","number":122,"text":"Thực tiễn công nhân Việt Nam trong các tập đoàn kinh tế (như Viettel, VinFast, VNPT...) trực tiếp nghiên cứu, vận hành công nghệ 5G, sản xuất xe điện, thiết bị bán dẫn phản ánh khía cạnh nào trong SMLS của GCCN về phương diện kinh tế?","options":{"A":"Vai trò đi đầu trong sự nghiệp công nghiệp hóa, hiện đại hóa và phát triển lực lượng sản xuất hiện đại.","B":"Việc thay thế hoàn toàn vai trò nghiên cứu khoa học - công nghệ của đội ngũ trí thức Việt Nam.","C":"Quá trình tự giải thể của giai cấp công nhân để chuyển thành giai cấp tư sản công nghệ cao.","D":"Việc xóa bỏ hoàn toàn sự phân chia lao động giữa các ngành công nghiệp và dịch vụ truyền thống."},"correctAnswer":"A"},{"id":"q_123_120","number":123,"text":"Đặc điểm nào phù hợp với giai cấp công nhân hiện đại?","options":{"A":"Lao động gắn với nền sản xuất hiện đại, có mức độ xã hội hóa và hàm lượng khoa học - công nghệ ngày càng cao.","B":"Lao động tách biệt, ít phụ thuộc vào phân công và phối hợp xã hội.","C":"Lao động chủ yếu dựa trên sở hữu nhỏ và tính tự cung tự cấp.","D":"Lao động chủ yếu dựa vào công cụ thủ công và kinh nghiệm cá nhân."},"correctAnswer":"A"},{"id":"q_124_121","number":124,"text":"Để giải quyết hài hòa mối quan hệ giữa \"tăng trưởng kinh tế\" và \"thực hiện tiến bộ, công bằng xã hội\" đối với giai cấp công nhân trong nền kinh tế thị trường, đường lối của Đảng xác định phương hướng nào?","options":{"A":"Thực hiện chính sách phân phối cào bằng thu nhập giữa các ngành nghề nhằm xóa bỏ ngay lập tức sự phân hóa giàu nghèo.","B":"Giới hạn tỷ suất lợi nhuận của các doanh nghiệp tư nhân ở mức tối đa 10% để dành phần lớn tiền thưởng cho công nhân.","C":"Không chờ đợi kinh tế phát triển cao rồi mới thực hiện công bằng xã hội; phân phối hợp lý theo kết quả lao động và an sinh.","D":"Chấp nhận hạ thấp tiêu chuẩn bảo vệ môi trường và điều kiện lao động để ưu tiên thu hút tối đa vốn đầu tư."},"correctAnswer":"C"},{"id":"q_125_122","number":125,"text":"Theo chủ nghĩa Mác - Lênin, điểm khác biệt cơ bản giữa giai cấp công nhân và tầng lớp trí thức là:","options":{"A":"Giai cấp công nhân và trí thức đều được xác định chủ yếu dựa trên trình độ học vấn và khả năng sáng tạo khoa học.","B":"Trí thức chỉ hoạt động trong lĩnh vực giáo dục và nghiên cứu còn giai cấp công nhân chỉ làm việc trong các nhà máy.","C":"Giai cấp công nhân được xác định trước hết bởi địa vị trong quan hệ sản xuất, còn trí thức là một tầng lớp xã hội phân bố trong nhiều giai cấp khác nhau.","D":"Trí thức luôn giữ vai trò lãnh đạo chính trị còn giai cấp công nhân chủ yếu thực hiện chức năng sản xuất vật chất."},"correctAnswer":"C"}]};
  let answers = {};
  function render() {
    const nav = document.getElementById('navGrid');
    const cont = document.getElementById('qContainer');
    nav.innerHTML = ''; cont.innerHTML = '';
    let answered = 0, correct = 0, wrong = 0, gradable = 0;
    QUIZ.questions.forEach(q => {
      const sel = answers[q.id];
      const hasKey = Boolean(q.correctAnswer);
      if (sel) answered++;
      if (hasKey) {
        gradable++;
        if (sel) { if (sel === q.correctAnswer) correct++; else wrong++; }
      }
      const btn = document.createElement('button');
      btn.className = 'nav-cell' + (sel && hasKey ? (sel === q.correctAnswer ? ' correct' : ' wrong') : '');
      btn.textContent = q.number;
      btn.onclick = () => document.getElementById('c_' + q.id).scrollIntoView({behavior:'smooth'});
      nav.appendChild(btn);

      const card = document.createElement('div');
      card.className = 'card'; card.id = 'c_' + q.id;
      card.innerHTML = '<div class="q-num">Câu ' + q.number + '</div><div class="q-text"></div>';
      card.querySelector('.q-text').textContent = q.text;
      ['A','B','C','D'].forEach(l => {
        const ob = document.createElement('button');
        ob.className = 'opt';
        if (sel) {
          if (!hasKey && sel === l) ob.classList.add('neutral');
          else if (hasKey && sel === l) ob.classList.add(sel === q.correctAnswer ? 'correct' : 'wrong');
          else if (hasKey && l === q.correctAnswer) ob.classList.add('correct');
        }
        ob.textContent = l + '. ' + q.options[l];
        ob.onclick = () => { answers[q.id] = l; render(); };
        card.appendChild(ob);
      });
      if (sel) {
        const fb = document.createElement('div');
        if (!hasKey) { fb.className = 'fb unconf'; fb.textContent = 'Câu hỏi chưa được thiết lập đáp án đúng'; }
        else if (sel === q.correctAnswer) { fb.className = 'fb correct'; fb.textContent = 'Chính xác!'; }
        else { fb.className = 'fb wrong'; fb.textContent = 'Chưa chính xác! Phương án đúng là ' + q.correctAnswer + '. ' + q.options[q.correctAnswer]; }
        card.appendChild(fb);
      }
      cont.appendChild(card);
    });
    const total = QUIZ.questions.length;
    const acc = gradable > 0 ? Math.round((correct / gradable) * 100) : 0;
    document.getElementById('stats').innerHTML =
      '<span class="pill">Tổng: ' + total + '</span>' +
      '<span class="pill">Đã trả lời: ' + answered + '</span>' +
      '<span class="pill">Đúng: ' + correct + '</span>' +
      '<span class="pill">Sai: ' + wrong + '</span>' +
      '<span class="pill">Chưa trả lời: ' + (total - answered) + '</span>' +
      '<span class="pill">Tỷ lệ: ' + acc + '%</span>';
  }
  function resetQuiz() { answers = {}; render(); }
  render();
</script>
